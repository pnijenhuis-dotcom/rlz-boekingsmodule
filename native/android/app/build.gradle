apply plugin: 'com.android.application'

// Signing (Android-bouwronde 28-08, Play App Signing-model): de UPLOAD-keystore staat BUITEN
// de repo; pad + wachtwoorden komen uit `keystore.properties` naast dit bestand (gitignored,
// aangemaakt door ../scripts/android_keystore.sh). Ontbreekt het bestand, dan bouwt de
// release-variant ONGESIGNEERD (bundleRelease levert dan een niet-uploadbare AAB) en zegt
// Gradle dat luid — nooit stil een debug-key op een release zetten.
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('keystore.properties')
def uploadSigningAanwezig = keystorePropertiesFile.exists()
if (uploadSigningAanwezig) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
    ['storeFile', 'storePassword', 'keyAlias', 'keyPassword'].each { sleutel ->
        if (!keystoreProperties.getProperty(sleutel)) {
            throw new GradleException("keystore.properties mist '${sleutel}' — draai native/scripts/android_keystore.sh opnieuw.")
        }
    }
} else {
    logger.warn("LET OP: native/android/keystore.properties ontbreekt — release wordt NIET gesigneerd (niet uploadbaar naar Play). Zie native/PLAY_DRAAIBOEK.md §2.")
}

android {
    namespace = "nl.aknijenhuis.goedkeuren"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "nl.aknijenhuis.goedkeuren"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // Versiebeleid (STORE_GEREEDHEID §6): versionName loopt gelijk met MARKETING_VERSION van
        // de iOS-app (1.0); versionCode moet per Play-upload strikt omhoog (Play weigert een
        // hergebruikt nummer). Overschrijfbaar zonder code-wijziging voor een latere
        // CI-opzet: ./gradlew bundleRelease -PversionCode=12 -PversionName=1.1
        // Default 2 sinds de app-lock-module (31-08) — de eerstvolgende Play-upload draagt
        // sowieso een hoger nummer dan de interne test-release (vc1).
        versionCode(project.hasProperty('versionCode') ? project.property('versionCode').toString().toInteger() : 2)
        versionName(project.hasProperty('versionName') ? project.property('versionName').toString() : "1.0")
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        if (uploadSigningAanwezig) {
            release {
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }
    buildTypes {
        release {
            // R8 in IDENTITEITSMODUS (Play-nazorg 30-08): Play waarschuwt bij élke upload zonder
            // deobfuscation-bestand, ook als er niets geobfusceerd is. Wij obfusceren bewust NIET
            // (JS-app in een dunne schil, leesbare stacktraces wegen zwaarder) — proguard-rules.pro
            // zet -dontobfuscate/-dontoptimize/-dontshrink, zodat R8 de bytecode ongewijzigd laat
            // maar wél mapping.txt schrijft; AGP bundelt die als BUNDLE-METADATA/…/proguard.map en
            // bouw_android_release.sh legt 'm náást de AAB. Echt shrinken/obfusceren = apart
            // besluit mét emulator-kliktest (BESLISSINGEN "PLAY-NAZORG 30-08").
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (uploadSigningAanwezig) {
                signingConfig signingConfigs.release
            }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    // Passkeys via Credential Manager (NatievePasskeyPlugin, store-app fase 2); het
    // play-services-auth-artefact levert de daadwerkelijke provider op Google-toestellen.
    implementation "androidx.credentials:credentials:1.5.0"
    implementation "androidx.credentials:credentials-play-services-auth:1.5.0"
    // Refresh-token in Keystore-gedekte opslag (VeiligeOpslagPlugin, store-app fase 4).
    implementation "androidx.security:security-crypto:1.1.0-alpha06"
    // App-lock: BiometricPrompt voor de Face ID-/vingerafdruk-gemakslaag (AppSlotPlugin, 31-08).
    implementation "androidx.biometric:biometric:1.1.0"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

// Firebase Cloud Messaging (native push fase 3, Android-kant — bouwronde 28-08). De
// google-services.json is de Firebase-app-registratie van nl.aknijenhuis.goedkeuren in het
// GCP-project rlz-boekhouding (géén geheim: bevat alleen project-id/-nummer, app-id en de
// publieke Android-API-key; Analytics staat bewust UIT). Het bestand hoort gecommit te zijn —
// daarom hier ONVOORWAARDELIJK toepassen: ontbreekt het, dan faalt de build luid in plaats
// van stil een app zonder push te bouwen (Capacitors template deed try/catch + logger.info).
def googleServicesJson = file('google-services.json')
if (!googleServicesJson.exists()) {
    throw new GradleException("native/android/app/google-services.json ontbreekt — Firebase-registratie (FCM) vereist, zie native/PLAY_DRAAIBOEK.md §0.")
}
apply plugin: 'com.google.gms.google-services'
