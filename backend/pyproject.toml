[project]
name = "rlz-boekingsmodule"
version = "0.1.0"
description = "RLZ Boekingsmodule backend (Administratiekantoor Nijenhuis)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.5",
    "httpx>=0.27",
    "tenacity>=9.0",
    "python-dotenv>=1.0",
    "argon2-cffi>=23.1",
    "pyotp>=2.9",
    "pyjwt>=2.9",
    "cryptography>=43.0",
    "python-multipart>=0.0.12",
    "anthropic>=0.40",
    "pypdf>=5.1",
    # Passkeys accordeur-PWA (blok 1, 2026-08-11): server-side WebAuthn-verificatie.
    # Bewezen implementatie (duo-labs/Cisco), BSD-3-Clause, actief onderhouden (3.x).
    "webauthn>=3.0",
    # GCP-uitrol (draaiboek F1, 2026-08-13): documentopslag (GcsDocumentOpslag) en de
    # Cloud KMS-masterkeyprovider (§2b-norm). Runtime-dependencies van het productiebeeld;
    # lokaal blijven bestandssysteem + LocalMasterKeyProvider de default en worden deze
    # clients nooit aangeraakt (lazy imports, tests draaien tegen fakes).
    "google-cloud-storage>=2.18",
    "google-cloud-kms>=3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-env>=1.1",
    "ruff>=0.7",
    # Docs-tooling: md → docx voor het AVG-pakket (scripts/genereer_avg_docx.py) — de .md is
    # canoniek, de .docx een gegenereerd verzend-artefact.
    "markdown>=3.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
# B008: FastAPI's Depends(...)-in-default-argument is het idiomatische patroon, geen bug.
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
# E501: migraties bevatten letterlijke SQL/plpgsql-tekst (RAISE-berichten, INSERT-statements);
# handmatig afbreken zou de string-inhoud van al-toegepaste migraties riskeren voor puur
# cosmetische winst — niet de moeite waard.
"migrations/versions/*.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# write_integration én read_integration zijn opt-in: een kale pytest-run mag NOOIT de live RLZ-
# testadministratie raken, ook niet alleen-lezend. Expliciet draaien: `make test-write-integration`
# / `make test-read-integration` (of handmatig `pytest -m <marker> --override-ini='addopts='`).
addopts = '-m "not write_integration and not read_integration and not ai_integration"'
markers = [
    "write_integration: schrijf-integratietests tegen een echte RLZ-testadministratie (skipt zonder TESTADMIN_* credentials) — opt-in, zie addopts hierboven",
    "read_integration: alleen-lezende integratietests tegen een echte RLZ-administratie (skipt zonder credentials) — ook opt-in, zie addopts hierboven",
    "ai_integration: echte Claude-API-aanroepen (kost geld, vereist ANTHROPIC_API_KEY) — opt-in, zie addopts hierboven",
]
