# Deploy-workflow — SKELET (GCP-draaiboek F1.6/F2, beslispunt 10: GitHub Actions + WIF
# naar vastgoed-patroon). NOG NIET ACTIEF: draait uitsluitend handmatig (workflow_dispatch)
# en weigert zolang de F0-invulwaarden hieronder op VUL-IN staan. Peter's F0-run
# (scripts/gcp/f0_fundament.sh) print aan het slot precies deze waarden.
#
# Geen langlevende service-account-keys: authenticatie via Workload Identity Federation
# (pool `github`, provider `github-oidc`, harde repo-conditie op
# pnijenhuis-dotcom/rlz-boekingsmodule — zie f0_fundament.sh stap 5).
#
# Deploy-volgorde is het draaiboek-patroon (F2.1): eerst de migratie-job (alembic upgrade
# head) uit het NIEUWE beeld, dán pas de nieuwe revisie live. De migratie-guard in de
# backend-lifespan is de vangrail als deze volgorde ooit geschonden wordt.

name: deploy

on:
  workflow_dispatch: {}
  # Activering (F2, ná de dummy-push-verificatie): onderstaande push-trigger openzetten.
  # push:
  #   branches: [main]

env:
  # ---- F0-invulwaarden (uit het slot van scripts/gcp/f0_fundament.sh) ----
  PROJECT_ID: rlz-boekhouding
  PROJECT_NUMBER: "VUL-IN" # bv. 123456789012
  REGION: europe-west4
  # ------------------------------------------------------------------------
  # Afgeleiden (zelfde namen als het F0-script aanmaakt — niet aanpassen):
  #   WIF-provider:  projects/$PROJECT_NUMBER/locations/global/workloadIdentityPools/github/providers/github-oidc
  #   Deploy-SA:     deploy@$PROJECT_ID.iam.gserviceaccount.com
  #   Registry:      $REGION-docker.pkg.dev/$PROJECT_ID/rlz
  IMAGE: europe-west4-docker.pkg.dev/rlz-boekhouding/rlz/backend

permissions:
  contents: read
  id-token: write # vereist voor WIF (OIDC-token richting Google STS)

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Guard — skelet nog niet ingevuld
        run: |
          if [ "${PROJECT_NUMBER}" = "VUL-IN" ]; then
            echo "::error::Dit is het deploy-SKELET: PROJECT_NUMBER staat nog op VUL-IN." \
                 "Draai eerst scripts/gcp/f0_fundament.sh (F0) en vul de env-waarden bovenin in."
            exit 1
          fi

      - uses: actions/checkout@v4

      - name: Authenticatie via WIF (geen SA-keys)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/${{ env.PROJECT_NUMBER }}/locations/global/workloadIdentityPools/github/providers/github-oidc
          service_account: deploy@${{ env.PROJECT_ID }}.iam.gserviceaccount.com

      - name: gcloud + docker-auth op de registry
        uses: google-github-actions/setup-gcloud@v2
      - run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Backend-image bouwen en pushen
        run: |
          docker build -t "${IMAGE}:${GITHUB_SHA}" backend
          docker push "${IMAGE}:${GITHUB_SHA}"

      # Draaiboek-patroon F2.1: eerst migreren (aparte Cloud Run-job, zelfde beeld,
      # command-override `alembic upgrade head`), dán de revisie live. De job
      # `rlz-migratie` wordt in F2 aangemaakt; tot die tijd faalt deze stap expliciet —
      # nooit stil een revisie uitrollen zonder migratiestap.
      - name: Migratie-job draaien (alembic upgrade head)
        run: |
          gcloud run jobs update rlz-migratie \
            --image "${IMAGE}:${GITHUB_SHA}" \
            --region "${REGION}" \
            --project "${PROJECT_ID}"
          gcloud run jobs execute rlz-migratie \
            --region "${REGION}" \
            --project "${PROJECT_ID}" \
            --wait

      - name: Cloud Run-revisie uitrollen
        run: |
          gcloud run deploy rlz-backend \
            --image "${IMAGE}:${GITHUB_SHA}" \
            --region "${REGION}" \
            --project "${PROJECT_ID}"
