# Deploy-workflow (GCP-draaiboek F2, beslispunt 10: GitHub Actions + WIF naar
# vastgoed-patroon). ACTIEF sinds F2 (2026-08-14): elke push naar main bouwt het beeld
# (backend + frontend-build, same-origin — beslispunt 4), draait éérst de migratie-job en
# rolt dán de nieuwe revisie uit. `gcloud run jobs deploy` / `gcloud run deploy` zijn
# create-or-update: de eerste run maakt job `rlz-migratie` en service `rlz-backend` zelf
# aan (F0-les: idempotent vanaf het begin), met de volledige runtime-config hieronder —
# de config is daarmee versiebeheerd in git, niet klikwerk in de console.
#
# Geen langlevende service-account-keys: authenticatie via Workload Identity Federation
# (pool `github`, provider `github-oidc`, harde repo-conditie op
# pnijenhuis-dotcom/rlz-boekingsmodule — zie f0_fundament.sh stap 5, F0-run 2026-08-14).
#
# Deploy-volgorde is het draaiboek-patroon (F2.1): eerst de migratie-job (alembic upgrade
# head) uit het NIEUWE beeld, dán pas de nieuwe revisie live. De migratie-guard in de
# backend-lifespan is de vangrail als deze volgorde ooit geschonden wordt.
#
# Secrets (besluit 0012): uitsluitend als Secret Manager-verwijzing (--set-secrets), nooit
# als waarde in deze file of in env-vars. ANTHROPIC_API_KEY is sinds 2026-08-25 gemount
# (Peter zette de waarde als versie 2; kliktest 25-08: "AI-extractie overgeslagen: geen
# Claude-API-key" bij Kempen Facilities) — uitsluitend op de service (upload-extractie,
# splitsing, projecten-ontleding) en op de job rlz-intake-imap (intake-AI in
# app/intake/verwerking.py); geen enkele andere job raakt de Claude-client (least
# privilege). De AVG-gates (intake_ai / ai_extractie per administratie) en de
# AI-kostengrens (€ 100/mnd) blijven onverkort de poorten vóór élke call. F4-activatie-editie (cutover 2026-08-24, runbook stap 8 aangepast
# aan de SA-grant-route): PROJECTAANVRAAG_HMAC_SECRET op de service (inkomend kanaal);
# de afleveraar-job heeft een eigen blok met WEBHOOK_HMAC_SECRET als cross-project-
# verwijzing naar Vastly's slot WEBHOOK_RLZ_SECRET in vastly-504108 (⚠️ naamverschil,
# zelfde waarde; accessors run-backend@ + run-jobs@ door vastgoed gezet) +
# WEBHOOK_DOEL_URL — UITSLUITEND op die job (least privilege).

name: deploy

on:
  workflow_dispatch: {}
  push:
    branches: [main]

env:
  # ---- F0-waarden (F0-run 2026-08-14, slot van scripts/gcp/f0_hervat3.sh) ----
  PROJECT_ID: rlz-boekhouding
  PROJECT_NUMBER: "652591056217"
  REGION: europe-west4
  # ------------------------------------------------------------------------
  # Afgeleiden (zelfde namen als de F0/F1-scripts aanmaken — niet aanpassen):
  #   WIF-provider:  projects/$PROJECT_NUMBER/locations/global/workloadIdentityPools/github/providers/github-oidc
  #   Deploy-SA:     deploy@$PROJECT_ID.iam.gserviceaccount.com
  #   Registry:      $REGION-docker.pkg.dev/$PROJECT_ID/rlz
  IMAGE: europe-west4-docker.pkg.dev/rlz-boekhouding/rlz/backend
  # Cloud SQL instance-connection-name (F5/besluit 0021: instantie rlz-sql2, herbouwd
  # mét CMEK — de oude rlz-sql is na de groene verificatie opgeruimd) — de app composeert
  # hier samen met het wachtwoord-secret de database-URL uit (app/config.py, F2).
  CLOUD_SQL: rlz-boekhouding:europe-west4:rlz-sql2
  # Leesreplica (Feiten eerst, afronding 17-09 — BESLISSINGEN "FEITEN EERST …"): `rlz-sql2-lees` (ZONAL, ENTERPRISE, CMEK geërfd,
  # IAM-auth + pgaudit). Service én jobs krijgen de socket (`--set-cloudsql-instances` beide instanties) en composeren de
  # replica-URL uit LEES_CLOUD_SQL_VERBINDING + het app-wachtwoord (app/config.py) — pas dán werken `POST /lezen/sql` en
  # `db-lezen --sql`. De migratie-job blijft op de primary alleen (owner-rol, schrijft).
  CLOUD_SQL_LEES: rlz-boekhouding:europe-west4:rlz-sql2-lees
  # ---- GEDEELDE ENVSETS (Peter 16-09, BESLISSINGEN "DEPLOY — VOLLEDIGE ENVSET IN ÉÉN STAP") ----
  # Eén bron voor de mail-/push-config van service én jobs: `${MAIL_ENVS}` enz. worden in de
  # `--set-env-vars`/`--set-secrets` van de deploy-stappen geëxpandeerd — service en jobs lopen zo
  # nooit uit elkaar. Envsets met '|' als scheider (les 10-09: '|' staat in geen enkele waarde;
  # e-mailadressen dragen '@', JSON-lijsten ',' en '"'). Secrets-lijsten met ',' (geen komma in een naam).
  # Guard: tests/unit/test_deploy_yml_envset_compleet.py (expandeert deze constanten en eist de volledige
  # envset in de ENE service-stap; een losse `services update`/`jobs update` op envs is rood).
  MAIL_ENVS: "BERICHTEN_SMTP_HOST=smtp.gmail.com|BERICHTEN_SMTP_POORT=465|BERICHTEN_SMTP_GEBRUIKER=facturen@ak-nijenhuis.nl|BERICHTEN_AFZENDER=facturen@ak-nijenhuis.nl|BERICHTEN_REPLY_TO=p.nijenhuis@kempengroep.nl|APP_BASIS_URL=https://app.administratiekantoornijenhuis.nl"
  MAIL_SECRETS: "BERICHTEN_SMTP_WACHTWOORD=BERICHTEN_SMTP_WACHTWOORD:latest"
  PUSH_ENVS: "APNS_SANDBOX=false|APPLE_TEAM_ID=VRQP26CX43"
  PUSH_SECRETS: "PUSH_VAPID_PRIVATE_KEY=PUSH_VAPID_PRIVATE_KEY:latest,PUSH_VAPID_PUBLIC_KEY=PUSH_VAPID_PUBLIC_KEY:latest,APNS_KEY_P8=APNS_KEY_P8:latest,APNS_KEY_ID=APNS_KEY_ID:latest"
  # OTA (Peter 16-09): eigen bucket voor de webbundels van de native app (aanmaken + IAM = scripts/gcp/app_bundels_bucket.sh,
  # eenmalig door de owner); APP_MIN_RUNTIME_VERSIE = minimale schilversie (426 eronder) — ophogen ná een winkelrelease
  # die native wijzigingen draagt, nooit vóór de winkelversie live is.
  APP_BUNDEL_BUCKET: rlz-boekhouding-app-bundels
  APP_MIN_RUNTIME_VERSIE: "1.1"

permissions:
  contents: read
  id-token: write # vereist voor WIF (OIDC-token richting Google STS)

concurrency:
  # Nooit twee deploys door elkaar (migratie-job + revisie-uitrol zijn een volgorde);
  # een nieuwere push wacht netjes op de lopende run.
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Les vastgoed 20-08 (run #50) / conventies.md CI-gates punt 8,
    # geland 01-09 (drift-audit I3): elke job een harde bovengrens.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Authenticatie via WIF (geen SA-keys)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/${{ env.PROJECT_NUMBER }}/locations/global/workloadIdentityPools/github/providers/github-oidc
          service_account: deploy@${{ env.PROJECT_ID }}.iam.gserviceaccount.com

      - name: gcloud + docker-auth op de registry
        uses: google-github-actions/setup-gcloud@v2
      - run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Image bouwen en pushen (backend + frontend-build, context = repo-root)
        run: |
          docker build -f backend/Dockerfile -t "${IMAGE}:${GITHUB_SHA}" .
          docker push "${IMAGE}:${GITHUB_SHA}"

      # Draaiboek-patroon F2.1: eerst migreren (aparte Cloud Run-job, zelfde beeld,
      # command-override `alembic upgrade head`), dán de revisie live. run-jobs@ is de
      # enige SA met toegang tot DB_OWNER_WACHTWOORD (F1, least privilege); de app
      # composeert daar met CLOUD_SQL_VERBINDING de owner-URL uit. APP_DB_PASSWORD hoort
      # hier óók: migraties die de app-rol/grants raken (0001) lezen 'm, en run-jobs@
      # heeft de accessor al (F1 1.4). max-retries 0: een gefaalde migratie nooit stil
      # herhalen, de run faalt zichtbaar.
      - name: Migratie-job bijwerken + draaien (alembic upgrade head)
        run: |
          gcloud run jobs deploy rlz-migratie \
            --image "${IMAGE}:${GITHUB_SHA}" \
            --region "${REGION}" \
            --project "${PROJECT_ID}" \
            --service-account "run-jobs@${PROJECT_ID}.iam.gserviceaccount.com" \
            --set-cloudsql-instances "${CLOUD_SQL}" \
            --set-env-vars "ENVIRONMENT=production,CLOUD_SQL_VERBINDING=${CLOUD_SQL}" \
            --set-secrets "DB_OWNER_WACHTWOORD=DB_OWNER_WACHTWOORD:latest,APP_DB_PASSWORD=APP_DB_PASSWORD:latest" \
            --command alembic \
            --args upgrade,head \
            --max-retries 0 \
            --task-timeout 900 \
            --quiet
          gcloud run jobs execute rlz-migratie \
            --region "${REGION}" \
            --project "${PROJECT_ID}" \
            --wait

      # Runtime-config als code (F2.3/F2.4): ENVIRONMENT=production laat alle
      # dev-fallback-guards bijten (Secure-cookies, geen dev-stub, geen in-process
      # afleveraar-lus); WebAuthn RP ID = het APEX-domein (F2-bouwvereiste — passkeys
      # blijven geldig op alle subdomeinen), origin = het app-subdomein; CORS leeg
      # (same-origin, beslispunt 4). ^|^ = gcloud's eigen delimiter-escape zodat
      # JSON-lijstwaarden (met ',') veilig zijn — '|' staat in geen waarde (les 10-09). PUBLIEK BEREIKBAAR zonder `--allow-unauthenticated`
      # (ochtendrun 11-09 blok 2.2): de allUsers-invoker-binding staat éénmalig gezet in
      # f2_services.sh stap 3 (owner) en overleeft elke revisie; de vlag probeerde 'm elke
      # deploy opnieuw te zetten en faalde dagelijks op run.services.setIamPolicy voor deploy@
      # (run.developer) — een waarschuwing die een échte IAM-fout onzichtbaar maakte. De
      # post-deploy-smoketest toetst nu expliciet dat de app publiek een 200 geeft. De app
      # heeft eigen auth (JWT + TOTP/passkeys), de accordeur-PWA moet publiek bereikbaar zijn.
      # Native store-app (fase 2/4, kliktest-prep 2026-08-17): de apex-origin in
      # WEBAUTHN_ORIGINS (iOS-passkey-assertions dragen de rp_id-origin, niet het
      # app-subdomein) en de webview-origins in CORS: capacitor://localhost (iOS) én
      # https://localhost (Android — Capacitor's androidScheme, Android-bouwronde 28-08).
      # ANDROID_CERT_SHA256_VINGERAFDRUKKEN (Play App Signing live 30-08, PLAY_DRAAIBOEK §5): de
      # twee SHA-256-certificaten — [0] Google's app-signing-key (élke Play-install), [1] onze
      # upload-key (lokale bundletool-/apk-installs). Activeert de referentie-route
      # /.well-known/assetlinks.json op het app-subdomein (bindend exemplaar = statisch op de
      # WordPress-apex, native/apex-well-known/assetlinks.json — zelfde generator) én levert de
      # WebAuthn-origins `android:apk-key-hash:<b64url>` per certificaat: die leidt de backend
      # ZELF af (app/auth/android_signing.py::toegestane_webauthn_origins) — nooit met de hand
      # in WEBAUTHN_ORIGINS zetten. Drift-test: tests/auth/test_android_signing.py leest deze
      # regel en het apex-bestand en eist dat ze gelijk zijn. Geen geheim (certificaat-hashes).
      # APPLE_TEAM_ID (PDL-team, signing-ronde 2026-08-17) activeert
      # de AASA-leesroute app/auth/wellknown.py op het app-subdomein (referentie; de
      # bindende AASA staat als statisch bestand op de WordPress-apex) en is t.z.t. óók
      # de APNs-issuer (fase 3). Geen geheim — staat sowieso in de publieke AASA.
      # WARME START (besluit Peter 25-08, C3-vervolg — docs/COLD_START_ONDERZOEK_25-08.md):
      # --min-instances 1 houdt één instance permanent warm; zonder deze vlag schaalt de
      # service naar 0 en kost de eerste klik ná > ~15 min stilte 14,6–16,9 s (gemeten
      # 25-08). Bewust REQUEST-BASED billing (géén --no-cpu-throttling): idle-tarief
      # ≈ € 7/maand; CPU-always-allocated (≈ € 48/mnd) is niet nodig omdat achtergrondwerk
      # in Cloud Run-jobs draait. Verankerd hier zodat een volgende revisie 'm niet
      # terugdraait (zelfde patroon als Vastly, besluit 24-08). Alleen deze service —
      # jobs/schedulers ongemoeid. Terugdraaien = deze regel weghalen.
      # KvK-PRODUCTIE (E7, besluit Peter 07-09): de dossier-KvK-check (app/integraties/kvk.py,
      # routes /uren/kantoor/kvk/{nr} + /sync/.../crediteuren/kvk/{nr}) draaide zonder config op
      # KvK's TESTOMGEVING (fictieve data → "niet gevonden" bij echte nummers). Vastly en deze
      # module zijn dezelfde BV: secret KVK_API_KEY in rlz-boekhouding = kopie (machine-naar-
      # machine, 07-09) van vastly-504108/KVK_API_KEY; accessors run-backend@ + run-jobs@.
      # KVK_BASE_URL eindigt bewust op /basisprofielen — de client plakt er /{kvkNummer} achter;
      # de consistentiecheck in kvk.py eist sleutel én URL uit dezelfde omgeving (503 anders).
      # UITSLUITEND op de service (least privilege: geen job raakt de KvK-API).
      # VOLLEDIGE ENVSET IN ÉÉN STAP (Peter 16-09; BESLISSINGEN "DEPLOY — VOLLEDIGE ENVSET IN ÉÉN STAP"):
      # `--set-env-vars` VERVANGT de hele envset van de service. Tot 16-09 kwamen INTAKE_POSTVAK_ADRES,
      # STORE_LINK_IOS, de BERICHTEN_*-mailconfig, VAPID/APNs/FCM pas in latere `services update`-stappen
      # terug → élke deploy had een venster van minuten zonder mail, en een run die ná de service-stap
      # rood ging (10-09 tweemaal, 16-09 `a23042e`) liet de service BLIJVEND zonder mailconfig achter
      # ("Mailkanaal niet geconfigureerd" bij de herstel-link van 16-09 09:00). Nu: álle envs + álle
      # secrets in déze ene stap — een nieuwe revisie is pas live mét complete config, volgorde-
      # onafhankelijk. Gedeelde sets (${MAIL_ENVS}, ${MAIL_SECRETS}, ${PUSH_ENVS}, ${PUSH_SECRETS}) staan
      # bovenin bij `env:` en zijn dezelfde als die van de jobs. Scheider '|' (les 10-09: komt in geen
      # waarde voor). Geen ||-fallback meer: een ontbrekend secret-slot maakt de deploy zichtbaar rood
      # (en mailt het beheer via de laatste stap) in plaats van een revisie zonder config uit te rollen.
      # Registersync §8 inbox_adres (verzoek Vastly 31-08): INTAKE_POSTVAK_ADRES reist mee op élke
      # actieve administratie-rij in de snapshot (zonder deze env laat de snapshot het veld weg).
      # Store-links (BESLISSINGEN "STORE-LINK-NAZORG"): STORE_LINK_IOS gevuld 09-09 (App Store-id
      # 6803862748); STORE_LINK_ANDROID blijft leeg tot Google de listing goedkeurt (leeg = niets tonen).
      # STORE_APP_VERSIE_IOS=1.1 sinds 17-09 (Apple keurde 1.1 (140) goed, App Store-lookup: version 1.1 vrijgegeven
      # 2026-09-16T23:23Z) — de uitnodigingsmail toont vanaf die deploy weer de App Store-link i.p.v. de TestFlight-
      # instructie (TESTFLIGHT_DRAAIBOEK §0f "STAND 17-09"); óók in BASIS_ENVS van de jobs (herinneringen mailen).
      # STORE_APP_VERSIE_ANDROID pas ná een publieke 1.x-listing (vc4 = 1.0 nog in review).
      # Notificatie-config op de service (herzien 17-08): uitnodigingsmail + herinner-knop + het volledige
      # VAPID-paar (webpush per direct vanuit de service) + APNs/FCM (native-registratie is fail-closed 409
      # zolang die config ontbreekt; APNS_SANDBOX=false sinds A6 21-08 = TestFlight/production-build).
      - name: Cloud Run-revisie uitrollen (volledige envset + secrets in één stap)
        run: |
          gcloud run deploy rlz-backend \
            --image "${IMAGE}:${GITHUB_SHA}" \
            --region "${REGION}" \
            --project "${PROJECT_ID}" \
            --service-account "run-backend@${PROJECT_ID}.iam.gserviceaccount.com" \
            --set-cloudsql-instances "${CLOUD_SQL},${CLOUD_SQL_LEES}" \
            --memory 1Gi \
            --cpu 1 \
            --min-instances 1 \
            --set-env-vars "^|^ENVIRONMENT=production|CLOUD_SQL_VERBINDING=${CLOUD_SQL}|LEES_CLOUD_SQL_VERBINDING=${CLOUD_SQL_LEES}|WEBAUTHN_RP_ID=administratiekantoornijenhuis.nl|WEBAUTHN_ORIGINS=[\"https://app.administratiekantoornijenhuis.nl\",\"https://administratiekantoornijenhuis.nl\"]|ANDROID_CERT_SHA256_VINGERAFDRUKKEN=[\"2C:EA:32:F9:44:A7:52:F9:DB:1E:87:B4:0F:DF:87:2C:F7:14:09:20:1D:F1:54:C9:16:70:2C:3D:E3:3E:3F:49\",\"4A:B4:3C:F1:E9:86:EA:58:02:D7:3F:7A:78:13:FB:F5:EF:C0:17:0F:E8:35:00:01:2E:2C:45:02:00:E9:8F:A1\"]|CORS_ALLOWED_ORIGINS=[\"capacitor://localhost\",\"https://localhost\"]|DOCUMENT_GCS_BUCKET=rlz-boekhouding-documenten|KMS_MASTERKEY_SLEUTEL=projects/${PROJECT_ID}/locations/${REGION}/keyRings/rlz/cryptoKeys/masterkey|CIJFERS_SYNC_JOB_RESOURCE=projects/${PROJECT_ID}/locations/${REGION}/jobs/rlz-projecten-cijfers|BANK_SYNC_JOB_RESOURCE=projects/${PROJECT_ID}/locations/${REGION}/jobs/rlz-bank-sync|EXTRACTIE_WACHTRIJ_JOB_RESOURCE=projects/${PROJECT_ID}/locations/${REGION}/jobs/rlz-extractie-wachtrij|BOEK_WACHTRIJ_JOB_RESOURCE=projects/${PROJECT_ID}/locations/${REGION}/jobs/rlz-boek-wachtrij|EERSTE_SYNC_JOB_RESOURCE=projects/${PROJECT_ID}/locations/${REGION}/jobs/rlz-eerste-sync|TERUGKEREND_HERBEREKEN_JOB_RESOURCE=projects/${PROJECT_ID}/locations/${REGION}/jobs/rlz-terugkerend-herbereken|RECONCILIATIE_JOB_RESOURCE=projects/${PROJECT_ID}/locations/${REGION}/jobs/rlz-reconciliatie|KVK_BASE_URL=https://api.kvk.nl/api/v1/basisprofielen|INTAKE_POSTVAK_ADRES=facturen@ak-nijenhuis.nl|STORE_LINK_IOS=https://apps.apple.com/app/nijenhuis-boekingsmodule/id6803862748|STORE_APP_VERSIE_IOS=1.1|FCM_PROJECT_ID=${PROJECT_ID}|APP_BUNDEL_GCS_BUCKET=${APP_BUNDEL_BUCKET}|APP_MIN_RUNTIME_VERSIE=${APP_MIN_RUNTIME_VERSIE}|OTA_UITGESCHAKELD=false|${MAIL_ENVS}|${PUSH_ENVS}" \
            --set-secrets "APP_DB_WACHTWOORD=APP_DB_PASSWORD:latest,JWT_SECRET=JWT_SECRET:latest,TOTP_MASTER_KEY_B64=TOTP_MASTER_KEY:latest,PROJECTAANVRAAG_HMAC_SECRET=PROJECTAANVRAAG_HMAC_SECRET:latest,ANTHROPIC_API_KEY=ANTHROPIC_API_KEY:latest,REGISTERSYNC_HMAC_SECRET=REGISTERSYNC_HMAC_SECRET:latest,KVK_API_KEY=KVK_API_KEY:latest,${MAIL_SECRETS},${PUSH_SECRETS}" \
            --quiet

      # F3-jobs (draaiboek §F3): de bestaande CLI-commando's zijn de entrypoints — zelfde
      # beeld als de service, per job een eigen definitie (een hangende sync blokkeert nooit
      # de afleveraar). Config-as-code, zelfde patroon als rlz-migratie hierboven; de
      # Scheduler-cadans + alerting + IAM staan in scripts/gcp/f3_jobs.sh (owner, eenmalig).
      # VOLLEDIGE ENVSET PER JOB (16-09): élke job krijgt in zijn ENE `jobs deploy` de complete envset +
      # secrets (basis + per-job-extra's uit de `case`), geen losse `jobs update --update-env-vars` meer
      # erachter — dezelfde les als bij de service. Per-job-extra's:
      # - rlz-intake-imap (F3.4, geactiveerd 15-08 na de Workspace-DPA-check): IMAP-envs + app-wachtwoord
      #   (INTAKE_IMAP_WACHTWOORD, versie door Peter; de scheduler-pauze is de aan/uit-knop) + ANTHROPIC_API_KEY
      #   (intake-AI: extractie + splitsing achter de intake_ai-gate + kostengrens).
      # - rlz-extractie-wachtrij (26-08): ANTHROPIC_API_KEY (least privilege: alleen AI-dragende jobs).
      # - rlz-accordeur-herinneringen + rlz-nieuwe-facturen (15/16-08, native push fase 3 17-08): mail + VAPID
      #   + APNs (APNS_KEY_P8/ID uit Secret Manager, apns_afronden.sh) + FCM (ADC van run-jobs@, fcm_afronden.sh).
      # - rlz-uren-herinneringen (run B 18-09): dag-einde herinnering veld-app — zelfde mail + push-envset als de
      #   accordeur-herinneringen (push-anders-mail); scheduler elk kwartier 15:00–18:45 ma–vr (f3_jobs.sh).
      # - rlz-kantoor-digest (16-09 gevonden): mailt de weekdigest maar droeg tot 16-09 GEEN mailconfig →
      #   nu ${MAIL_ENVS}/${MAIL_SECRETS}.
      # - rlz-reconciliatie (06-09): mailkanaal voor actie-/systeemmail + APP_BASIS_URL (link in de mail).
      # - rlz-bewaking (31-08, 11-09): mail-alerts, BEWAKING_RLZ_ADMINISTRATIE_ID = de TEST-administratie
      #   (lichte leesroute, nooit writes), BEWAKING_SERVICE_RESOURCE voor de deploy-drift-probe (vereist
      #   roles/run.viewer op run-jobs@ — scripts/gcp/bewaking_deploy_drift_iam.sh), ANTHROPIC_API_KEY (uurlijkse
      #   minimale AI-probe onder de kostenmeter).
      # - rlz-webhook-afleveraar (F4, 24-08): alléén deze job draagt WEBHOOK_DOEL_URL + het uitgaande HMAC-secret;
      #   WEBHOOK_HMAC_SECRET mount cross-project Vastly's slot WEBHOOK_RLZ_SECRET in vastly-504108 (projectNÚMMER
      #   755625271889 in het pad — het project-id weigert gcloud, les 24-08).
      # ON-DEMAND-jobs (geen scheduler; getriggerd door de service via *_JOB_RESOURCE + run-backend@ roles/run.invoker,
      # f3_jobs.sh stap 6–11): rlz-projecten-cijfers, rlz-bank-sync (óók scheduler-vangnet), rlz-extractie-wachtrij
      # (+ */10-vangnet), rlz-boek-wachtrij (achtergrond-schrijver 'Boeken in RLZ', 18-09; + */2-vangnet), rlz-eerste-sync,
      # rlz-terugkerend-herbereken, rlz-reconciliatie ("Nu draaien").
      # rlz-sync task-timeout 5400 (blok 1 bundel 08-09): sync-alles draait óók de bank-sync voor álle administraties.
      # BEWAKING_ALERT_ONTVANGER blijft de code-default (p.nijenhuis@kempengroep.nl) — geen env nodig.
      - name: F3-jobs bijwerken (zelfde beeld, CLI-entrypoints, volledige envset per job)
        run: |
          BASIS_ENVS="ENVIRONMENT=production|CLOUD_SQL_VERBINDING=${CLOUD_SQL}|LEES_CLOUD_SQL_VERBINDING=${CLOUD_SQL_LEES}|STORE_LINK_IOS=https://apps.apple.com/app/nijenhuis-boekingsmodule/id6803862748|STORE_APP_VERSIE_IOS=1.1|DOCUMENT_GCS_BUCKET=rlz-boekhouding-documenten|KMS_MASTERKEY_SLEUTEL=projects/${PROJECT_ID}/locations/${REGION}/keyRings/rlz/cryptoKeys/masterkey|APP_BUNDEL_GCS_BUCKET=${APP_BUNDEL_BUCKET}|APP_MIN_RUNTIME_VERSIE=${APP_MIN_RUNTIME_VERSIE}"
          BASIS_SECRETS="APP_DB_WACHTWOORD=APP_DB_PASSWORD:latest"
          for JOB in \
            "rlz-sync|sync-alles|5400" \
            "rlz-reconciliatie|reconciliatie-alles|3600" \
            "rlz-intake-imap|intake-postvak-verwerken|900" \
            "rlz-accordeur-herinneringen|accordeur-herinneringen|600" \
            "rlz-nieuwe-facturen|nieuwe-facturen-melden|600" \
            "rlz-uren-herinneringen|uren-herinneringen|600" \
            "rlz-kantoor-digest|kantoor-digest|600" \
            "rlz-projecten-cijfers|projecten-cijfers-wachtrij|3600" \
            "rlz-bank-sync|bank-sync-wachtrij|900" \
            "rlz-extractie-wachtrij|extractie-wachtrij-verwerken|1800" \
            "rlz-boek-wachtrij|boek-wachtrij-verwerken|900" \
            "rlz-eerste-sync|eerste-sync-wachtrij|1800" \
            "rlz-terugkerend-herbereken|terugkerend-herbereken-wachtrij|1800" \
            "rlz-bewaking|bewaking-probe|300" \
            "rlz-webhook-afleveraar|webhook-afleveren|600" \
          ; do
            NAAM="${JOB%%|*}"; REST="${JOB#*|}"; CLI="${REST%%|*}"; TIMEOUT="${REST##*|}"
            ENVS="${BASIS_ENVS}"; SECRETS="${BASIS_SECRETS}"
            case "${NAAM}" in
              rlz-intake-imap)
                ENVS="${ENVS}|INTAKE_IMAP_HOST=imap.gmail.com|INTAKE_IMAP_POORT=993|INTAKE_IMAP_GEBRUIKER=facturen@ak-nijenhuis.nl|INTAKE_POSTVAK_ADRES=facturen@ak-nijenhuis.nl"
                SECRETS="${SECRETS},INTAKE_IMAP_WACHTWOORD=INTAKE_IMAP_WACHTWOORD:latest,ANTHROPIC_API_KEY=ANTHROPIC_API_KEY:latest" ;;
              rlz-extractie-wachtrij)
                SECRETS="${SECRETS},ANTHROPIC_API_KEY=ANTHROPIC_API_KEY:latest" ;;
              rlz-accordeur-herinneringen|rlz-nieuwe-facturen|rlz-uren-herinneringen)
                ENVS="${ENVS}|${MAIL_ENVS}|${PUSH_ENVS}|FCM_PROJECT_ID=${PROJECT_ID}"
                SECRETS="${SECRETS},${MAIL_SECRETS},${PUSH_SECRETS}" ;;
              rlz-kantoor-digest|rlz-reconciliatie)
                ENVS="${ENVS}|${MAIL_ENVS}"
                SECRETS="${SECRETS},${MAIL_SECRETS}" ;;
              rlz-bewaking)
                ENVS="${ENVS}|${MAIL_ENVS}|BEWAKING_RLZ_ADMINISTRATIE_ID=8dbfb856-d75b-4ec3-9124-c8b739fe3bc5|BEWAKING_SERVICE_RESOURCE=projects/${PROJECT_ID}/locations/${REGION}/services/rlz-backend"
                SECRETS="${SECRETS},${MAIL_SECRETS},ANTHROPIC_API_KEY=ANTHROPIC_API_KEY:latest" ;;
              rlz-webhook-afleveraar)
                ENVS="${ENVS}|WEBHOOK_DOEL_URL=https://api.vastly.software/webhooks/rlz"
                SECRETS="${SECRETS},WEBHOOK_HMAC_SECRET=projects/755625271889/secrets/WEBHOOK_RLZ_SECRET:latest" ;;
            esac
            gcloud run jobs deploy "${NAAM}" \
              --image "${IMAGE}:${GITHUB_SHA}" \
              --region "${REGION}" \
              --project "${PROJECT_ID}" \
              --service-account "run-jobs@${PROJECT_ID}.iam.gserviceaccount.com" \
              --set-cloudsql-instances "${CLOUD_SQL},${CLOUD_SQL_LEES}" \
              --set-env-vars "^|^${ENVS}" \
              --set-secrets "${SECRETS}" \
              --args="-m,app.cli,${CLI}" \
              --max-retries 0 \
              --task-timeout "${TIMEOUT}" \
              --quiet
          done

      # POST-DEPLOY-SMOKETEST (best-practice-besluit 1, 31-08 punt 4 — aanleiding: de
      # schema-limiet-bug van 30-08 haalde een groene deploy en legde de extractie een dag
      # plat). Drie toetsen, élke fout = deze run luid rood (geen ||-fallback, bewust):
      # 1. health op de nieuwe revisie (van buitenaf, via het echte domein);
      # 2. één kritieke gepoorte route: /auth/gebruikers hoort ZONDER token exact 401 te geven
      #    (bewijst dat de router live is én dat de auth-poort dichtzit — een 200 of een
      #    SPA-fallback is hier allebei fout);
      # 3. de rlz-smoketest-job (CLI deploy-smoketest, zelfde image): AI-schema-zelftest
      #    (union-limiet, de 30-08-klasse), DB + migratieversie, mailkanaal-config én (ochtendrun
      #    11-09) service en álle jobs op hetzelfde beeld — zonder gratie, de F3-lus is dan gelopen;
      #    (16-09) plus lees-only: de SERVICE-template draagt BERICHTEN_SMTP_HOST/-GEBRUIKER én het
      #    secret BERICHTEN_SMTP_WACHTWOORD (Cloud Run Admin API) — een revisie zonder mailconfig = rood.
      # 0. (11-09) de app is PUBLIEK bereikbaar: een browser-navigatie naar de SPA geeft 200 zonder
      #    token — dit vervangt de `--allow-unauthenticated`-vlag als bewijs dat de IAM-binding staat.
      # OTA-WEBBUNDEL (Peter 16-09, BESLISSINGEN "NATIVE APP — LIVE UPDATES (OTA)"): dezelfde frontend als in het beeld, maar
      # gebouwd mét `--mode native` (VITE_API_BASE = app-domein), gezipt, in de bundel-bucket gezet en geregistreerd voor de
      # RUNTIME = APP_MARKETING_VERSIE uit frontend/src/accordeur/appVersie.ts (een 1.1-schil krijgt nooit een 1.2-bundel).
      # Registratie loopt op de job-image (rlz-reconciliatie, ná de jobs-stap zodat het commando bestaat). Bucket ontbreekt →
      # deze stap faalt zichtbaar (klikpunt: scripts/gcp/app_bundels_bucket.sh); de service draait dan gewoon zonder OTA.
      - name: OTA-webbundel bouwen, uploaden en registreren (runtime = APP_MARKETING_VERSIE)
        run: |
          set -euo pipefail
          RUNTIME="$(sed -n "s/^export const APP_MARKETING_VERSIE = '\([0-9.]*\)'.*/\1/p" frontend/src/accordeur/appVersie.ts)"
          [ -n "${RUNTIME}" ] || { echo "FOUT: APP_MARKETING_VERSIE niet gevonden"; exit 1; }
          BUNDEL_ID="${GITHUB_SHA:0:7}-$(date -u +%Y%m%d-%H%M)"
          (cd frontend && npm ci --no-audit --no-fund && npm run build -- --mode native)
          (cd frontend/dist && zip -qr "../../bundel-${BUNDEL_ID}.zip" .)
          SHA="$(sha256sum "bundel-${BUNDEL_ID}.zip" | cut -d' ' -f1)"
          BYTES="$(stat -c %s "bundel-${BUNDEL_ID}.zip")"
          PAD="bundels/${RUNTIME}/${BUNDEL_ID}.zip"
          gcloud storage cp "bundel-${BUNDEL_ID}.zip" "gs://${APP_BUNDEL_BUCKET}/${PAD}" --project "${PROJECT_ID}"
          gcloud run jobs execute rlz-reconciliatie \
            --region "${REGION}" \
            --project "${PROJECT_ID}" \
            --args="^|^-m|app.cli|app-bundel-registreren|--runtime|${RUNTIME}|--bundel-id|${BUNDEL_ID}|--pad|${PAD}|--sha256|${SHA}|--bytes|${BYTES}" \
            --wait
          echo "OTA-bundel ${BUNDEL_ID} (runtime ${RUNTIME}, ${BYTES} bytes, sha ${SHA:0:12}) geregistreerd"

      - name: Post-deploy-smoketest (publiek 200 + health + gepoorte route + schema-zelftest + zelfde beeld)
        run: |
          BASIS="https://app.administratiekantoornijenhuis.nl"
          PUBLIEK="$(curl -s -o /dev/null -m 20 -w "%{http_code}" -H "Accept: text/html" -H "Sec-Fetch-Dest: document" "${BASIS}/")"
          echo "publiek (SPA zonder token): ${PUBLIEK}"
          [ "${PUBLIEK}" = "200" ] || { echo "FOUT: de app is niet publiek bereikbaar (verwachtte 200, kreeg ${PUBLIEK}) — allUsers-invoker-binding weg? (f2_services.sh stap 3)"; exit 1; }
          STATUS="$(curl -fsS -m 20 "${BASIS}/health")"
          echo "health: ${STATUS}"
          echo "${STATUS}" | grep -q '"status":[[:space:]]*"ok"' || { echo "FOUT: /health antwoordt niet ok"; exit 1; }
          CODE="$(curl -s -o /dev/null -m 20 -w "%{http_code}" -H "Accept: application/json" "${BASIS}/auth/gebruikers")"
          echo "gepoorte route /auth/gebruikers zonder token: ${CODE}"
          [ "${CODE}" = "401" ] || { echo "FOUT: verwachtte 401, kreeg ${CODE}"; exit 1; }
          gcloud run jobs deploy rlz-smoketest \
            --image "${IMAGE}:${GITHUB_SHA}" \
            --region "${REGION}" \
            --project "${PROJECT_ID}" \
            --service-account "run-jobs@${PROJECT_ID}.iam.gserviceaccount.com" \
            --set-cloudsql-instances "${CLOUD_SQL},${CLOUD_SQL_LEES}" \
            --set-env-vars "^|^ENVIRONMENT=production|CLOUD_SQL_VERBINDING=${CLOUD_SQL}|LEES_CLOUD_SQL_VERBINDING=${CLOUD_SQL_LEES}|DOCUMENT_GCS_BUCKET=rlz-boekhouding-documenten|KMS_MASTERKEY_SLEUTEL=projects/${PROJECT_ID}/locations/${REGION}/keyRings/rlz/cryptoKeys/masterkey|${MAIL_ENVS}|BEWAKING_SERVICE_RESOURCE=projects/${PROJECT_ID}/locations/${REGION}/services/rlz-backend" \
            --set-secrets "APP_DB_WACHTWOORD=APP_DB_PASSWORD:latest,${MAIL_SECRETS}" \
            --command python \
            --args="-m,app.cli,deploy-smoketest" \
            --max-retries 0 \
            --task-timeout 300 \
            --quiet
          gcloud run jobs execute rlz-smoketest \
            --region "${REGION}" \
            --project "${PROJECT_ID}" \
            --wait

      # DEPLOY MISLUKT → MAIL (ochtendrun 11-09 blok 2.2). Zeven rode deploys #173–#179 (09/10-09) zag
      # niemand. Gekozen: de bestaande job rlz-bewaking draait `deploy-mislukt` (CLI) — die job heeft
      # het SMTP-kanaal al; deploy@ (run.developer) mag 'm mét args-override starten. Geen secret in
      # GitHub Actions, geen tweede mailkanaal. Loopt óók als de fout vóór de job-lus viel (de job
      # draait dan het vorige beeld — het commando bestaat sinds 11-09). Faalt dit zelf (gcloud-auth
      # kapot), dan blijft alleen GitHub's eigen failed-workflow-notificatie over: GCP_UITROL §F3.8
      # vraagt Peter die aan te zetten (Settings › Notifications › Actions).
      - name: Deploy mislukt → mail naar beheer (job rlz-bewaking, deploy-mislukt)
        if: failure()
        run: |
          gcloud run jobs execute rlz-bewaking \
            --region "${REGION}" \
            --project "${PROJECT_ID}" \
            --wait \
            --args="^|^-m|app.cli|deploy-mislukt|--sha|${GITHUB_SHA}|--run-url|${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|--stap|${{ github.ref_name }}" \
          || echo "LET OP: de mislukt-melding kon niet verstuurd worden — controleer deze run in GitHub Actions."
