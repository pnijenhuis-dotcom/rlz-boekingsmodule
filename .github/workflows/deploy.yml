# Deploy-workflow (GCP-draaiboek F2, beslispunt 10: GitHub Actions + WIF naar
# vastgoed-patroon). ACTIEF sinds F2 (2026-08-14): elke push naar main bouwt het beeld
# (backend + frontend-build, same-origin — beslispunt 4), draait éérst de migratie-job en
# rolt dán de nieuwe revisie uit. `gcloud run jobs deploy` / `gcloud run deploy` zijn
# create-or-update: de eerste run maakt job `rlz-migratie` en service `rlz-backend` zelf
# aan (F0-les: idempotent vanaf het begin), met de volledige runtime-config hieronder —
# de config is daarmee versiebeheerd in git, niet klikwerk in de console.
#
# Geen langlevende service-account-keys: authenticatie via Workload Identity Federation
# (pool `github`, provider `github-oidc`, harde repo-conditie op
# pnijenhuis-dotcom/rlz-boekingsmodule — zie f0_fundament.sh stap 5, F0-run 2026-08-14).
#
# Deploy-volgorde is het draaiboek-patroon (F2.1): eerst de migratie-job (alembic upgrade
# head) uit het NIEUWE beeld, dán pas de nieuwe revisie live. De migratie-guard in de
# backend-lifespan is de vangrail als deze volgorde ooit geschonden wordt.
#
# Secrets (besluit 0012): uitsluitend als Secret Manager-verwijzing (--set-secrets), nooit
# als waarde in deze file of in env-vars. ANTHROPIC_API_KEY is sinds 2026-08-25 gemount
# (Peter zette de waarde als versie 2; kliktest 25-08: "AI-extractie overgeslagen: geen
# Claude-API-key" bij Kempen Facilities) — uitsluitend op de service (upload-extractie,
# splitsing, projecten-ontleding) en op de job rlz-intake-imap (intake-AI in
# app/intake/verwerking.py); geen enkele andere job raakt de Claude-client (least
# privilege). De AVG-gates (intake_ai / ai_extractie per administratie) en de
# AI-kostengrens (€ 100/mnd) blijven onverkort de poorten vóór élke call. F4-activatie-editie (cutover 2026-08-24, runbook stap 8 aangepast
# aan de SA-grant-route): PROJECTAANVRAAG_HMAC_SECRET op de service (inkomend kanaal);
# de afleveraar-job heeft een eigen blok met WEBHOOK_HMAC_SECRET als cross-project-
# verwijzing naar Vastly's slot WEBHOOK_RLZ_SECRET in vastly-504108 (⚠️ naamverschil,
# zelfde waarde; accessors run-backend@ + run-jobs@ door vastgoed gezet) +
# WEBHOOK_DOEL_URL — UITSLUITEND op die job (least privilege).

name: deploy

on:
  workflow_dispatch: {}
  push:
    branches: [main]

env:
  # ---- F0-waarden (F0-run 2026-08-14, slot van scripts/gcp/f0_hervat3.sh) ----
  PROJECT_ID: rlz-boekhouding
  PROJECT_NUMBER: "652591056217"
  REGION: europe-west4
  # ------------------------------------------------------------------------
  # Afgeleiden (zelfde namen als de F0/F1-scripts aanmaken — niet aanpassen):
  #   WIF-provider:  projects/$PROJECT_NUMBER/locations/global/workloadIdentityPools/github/providers/github-oidc
  #   Deploy-SA:     deploy@$PROJECT_ID.iam.gserviceaccount.com
  #   Registry:      $REGION-docker.pkg.dev/$PROJECT_ID/rlz
  IMAGE: europe-west4-docker.pkg.dev/rlz-boekhouding/rlz/backend
  # Cloud SQL instance-connection-name (F5/besluit 0021: instantie rlz-sql2, herbouwd
  # mét CMEK — de oude rlz-sql is na de groene verificatie opgeruimd) — de app composeert
  # hier samen met het wachtwoord-secret de database-URL uit (app/config.py, F2).
  CLOUD_SQL: rlz-boekhouding:europe-west4:rlz-sql2

permissions:
  contents: read
  id-token: write # vereist voor WIF (OIDC-token richting Google STS)

concurrency:
  # Nooit twee deploys door elkaar (migratie-job + revisie-uitrol zijn een volgorde);
  # een nieuwere push wacht netjes op de lopende run.
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Authenticatie via WIF (geen SA-keys)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/${{ env.PROJECT_NUMBER }}/locations/global/workloadIdentityPools/github/providers/github-oidc
          service_account: deploy@${{ env.PROJECT_ID }}.iam.gserviceaccount.com

      - name: gcloud + docker-auth op de registry
        uses: google-github-actions/setup-gcloud@v2
      - run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Image bouwen en pushen (backend + frontend-build, context = repo-root)
        run: |
          docker build -f backend/Dockerfile -t "${IMAGE}:${GITHUB_SHA}" .
          docker push "${IMAGE}:${GITHUB_SHA}"

      # Draaiboek-patroon F2.1: eerst migreren (aparte Cloud Run-job, zelfde beeld,
      # command-override `alembic upgrade head`), dán de revisie live. run-jobs@ is de
      # enige SA met toegang tot DB_OWNER_WACHTWOORD (F1, least privilege); de app
      # composeert daar met CLOUD_SQL_VERBINDING de owner-URL uit. APP_DB_PASSWORD hoort
      # hier óók: migraties die de app-rol/grants raken (0001) lezen 'm, en run-jobs@
      # heeft de accessor al (F1 1.4). max-retries 0: een gefaalde migratie nooit stil
      # herhalen, de run faalt zichtbaar.
      - name: Migratie-job bijwerken + draaien (alembic upgrade head)
        run: |
          gcloud run jobs deploy rlz-migratie \
            --image "${IMAGE}:${GITHUB_SHA}" \
            --region "${REGION}" \
            --project "${PROJECT_ID}" \
            --service-account "run-jobs@${PROJECT_ID}.iam.gserviceaccount.com" \
            --set-cloudsql-instances "${CLOUD_SQL}" \
            --set-env-vars "ENVIRONMENT=production,CLOUD_SQL_VERBINDING=${CLOUD_SQL}" \
            --set-secrets "DB_OWNER_WACHTWOORD=DB_OWNER_WACHTWOORD:latest,APP_DB_PASSWORD=APP_DB_PASSWORD:latest" \
            --command alembic \
            --args upgrade,head \
            --max-retries 0 \
            --task-timeout 900 \
            --quiet
          gcloud run jobs execute rlz-migratie \
            --region "${REGION}" \
            --project "${PROJECT_ID}" \
            --wait

      # Runtime-config als code (F2.3/F2.4): ENVIRONMENT=production laat alle
      # dev-fallback-guards bijten (Secure-cookies, geen dev-stub, geen in-process
      # afleveraar-lus); WebAuthn RP ID = het APEX-domein (F2-bouwvereiste — passkeys
      # blijven geldig op alle subdomeinen), origin = het app-subdomein; CORS leeg
      # (same-origin, beslispunt 4). ^@^ = gcloud's eigen delimiter-escape zodat
      # JSON-lijstwaarden veilig zijn. --allow-unauthenticated: de app heeft eigen auth
      # (JWT + TOTP/passkeys), de accordeur-PWA moet publiek bereikbaar zijn. NB (les
      # run #2): deploy@ (run.developer) mist run.services.setIamPolicy — de flag kan
      # de allUsers-binding niet zélf zetten (gcloud waarschuwt, run blijft groen); de
      # binding wordt éénmalig gezet in f2_services.sh stap 3 (owner) en de flag vindt
      # 'm daarna al staan.
      # Native store-app (fase 2/4, kliktest-prep 2026-08-17): de apex-origin in
      # WEBAUTHN_ORIGINS (iOS-passkey-assertions dragen de rp_id-origin, niet het
      # app-subdomein) en de webview-origins in CORS: capacitor://localhost (iOS) én
      # https://localhost (Android — Capacitor's androidScheme, Android-bouwronde 28-08).
      # ANDROID_CERT_SHA256_VINGERAFDRUKKEN (Play App Signing live 30-08, PLAY_DRAAIBOEK §5): de
      # twee SHA-256-certificaten — [0] Google's app-signing-key (élke Play-install), [1] onze
      # upload-key (lokale bundletool-/apk-installs). Activeert de referentie-route
      # /.well-known/assetlinks.json op het app-subdomein (bindend exemplaar = statisch op de
      # WordPress-apex, native/apex-well-known/assetlinks.json — zelfde generator) én levert de
      # WebAuthn-origins `android:apk-key-hash:<b64url>` per certificaat: die leidt de backend
      # ZELF af (app/auth/android_signing.py::toegestane_webauthn_origins) — nooit met de hand
      # in WEBAUTHN_ORIGINS zetten. Drift-test: tests/auth/test_android_signing.py leest deze
      # regel en het apex-bestand en eist dat ze gelijk zijn. Geen geheim (certificaat-hashes).
      # APPLE_TEAM_ID (PDL-team, signing-ronde 2026-08-17) activeert
      # de AASA-leesroute app/auth/wellknown.py op het app-subdomein (referentie; de
      # bindende AASA staat als statisch bestand op de WordPress-apex) en is t.z.t. óók
      # de APNs-issuer (fase 3). Geen geheim — staat sowieso in de publieke AASA.
      # WARME START (besluit Peter 25-08, C3-vervolg — docs/COLD_START_ONDERZOEK_25-08.md):
      # --min-instances 1 houdt één instance permanent warm; zonder deze vlag schaalt de
      # service naar 0 en kost de eerste klik ná > ~15 min stilte 14,6–16,9 s (gemeten
      # 25-08). Bewust REQUEST-BASED billing (géén --no-cpu-throttling): idle-tarief
      # ≈ € 7/maand; CPU-always-allocated (≈ € 48/mnd) is niet nodig omdat achtergrondwerk
      # in Cloud Run-jobs draait. Verankerd hier zodat een volgende revisie 'm niet
      # terugdraait (zelfde patroon als Vastly, besluit 24-08). Alleen deze service —
      # jobs/schedulers ongemoeid. Terugdraaien = deze regel weghalen.
      - name: Cloud Run-revisie uitrollen
        run: |
          gcloud run deploy rlz-backend \
            --image "${IMAGE}:${GITHUB_SHA}" \
            --region "${REGION}" \
            --project "${PROJECT_ID}" \
            --service-account "run-backend@${PROJECT_ID}.iam.gserviceaccount.com" \
            --set-cloudsql-instances "${CLOUD_SQL}" \
            --allow-unauthenticated \
            --memory 1Gi \
            --cpu 1 \
            --min-instances 1 \
            --set-env-vars "^@^ENVIRONMENT=production@CLOUD_SQL_VERBINDING=${CLOUD_SQL}@WEBAUTHN_RP_ID=administratiekantoornijenhuis.nl@WEBAUTHN_ORIGINS=[\"https://app.administratiekantoornijenhuis.nl\",\"https://administratiekantoornijenhuis.nl\"]@ANDROID_CERT_SHA256_VINGERAFDRUKKEN=[\"2C:EA:32:F9:44:A7:52:F9:DB:1E:87:B4:0F:DF:87:2C:F7:14:09:20:1D:F1:54:C9:16:70:2C:3D:E3:3E:3F:49\",\"4A:B4:3C:F1:E9:86:EA:58:02:D7:3F:7A:78:13:FB:F5:EF:C0:17:0F:E8:35:00:01:2E:2C:45:02:00:E9:8F:A1\"]@CORS_ALLOWED_ORIGINS=[\"capacitor://localhost\",\"https://localhost\"]@APPLE_TEAM_ID=VRQP26CX43@DOCUMENT_GCS_BUCKET=rlz-boekhouding-documenten@KMS_MASTERKEY_SLEUTEL=projects/${PROJECT_ID}/locations/${REGION}/keyRings/rlz/cryptoKeys/masterkey@CIJFERS_SYNC_JOB_RESOURCE=projects/${PROJECT_ID}/locations/${REGION}/jobs/rlz-projecten-cijfers@BANK_SYNC_JOB_RESOURCE=projects/${PROJECT_ID}/locations/${REGION}/jobs/rlz-bank-sync@EXTRACTIE_WACHTRIJ_JOB_RESOURCE=projects/${PROJECT_ID}/locations/${REGION}/jobs/rlz-extractie-wachtrij@EERSTE_SYNC_JOB_RESOURCE=projects/${PROJECT_ID}/locations/${REGION}/jobs/rlz-eerste-sync" \
            --set-secrets "APP_DB_WACHTWOORD=APP_DB_PASSWORD:latest,JWT_SECRET=JWT_SECRET:latest,TOTP_MASTER_KEY_B64=TOTP_MASTER_KEY:latest,PROJECTAANVRAAG_HMAC_SECRET=PROJECTAANVRAAG_HMAC_SECRET:latest,ANTHROPIC_API_KEY=ANTHROPIC_API_KEY:latest,REGISTERSYNC_HMAC_SECRET=REGISTERSYNC_HMAC_SECRET:latest" \
            --quiet

      # F3-jobs (draaiboek §F3): de bestaande CLI-commando's zijn de entrypoints — zelfde
      # beeld als de service, per job een eigen definitie (een hangende sync blokkeert nooit
      # de afleveraar). Config-as-code, zelfde patroon als rlz-migratie hierboven; de
      # Scheduler-cadans + alerting + IAM staan in scripts/gcp/f3_jobs.sh (owner, eenmalig).
      # rlz-bank-sync is óók ON-DEMAND (feedbackronde 25-08 deel 4 punt 2): het openen van het
      # bankscherm zet een bank_sync_run klaar en triggert één uitvoering via
      # BANK_SYNC_JOB_RESOURCE (zelfde metadata-server-auth; run-backend@ heeft roles/run.invoker
      # op déze job — eenmalig via f3_jobs.sh stap 7). Drempel: < 5 min na de vorige sync
      # start er geen ronde (BANK_AUTO_VERVERS_DREMPEL_MINUTEN).
      # rlz-extractie-wachtrij (feedbackronde 26-08 punt 4): ON-DEMAND + scheduler-vangnet
      # (*/10). Een groot document (scan > 3 MB / > 8 pagina's) ging vóór 26-08 naar een
      # in-process thread die onder request-based CPU-throttling stilviel → "geüploade factuur
      # krijgt geen AI-extractie". Nu triggert de service één job-uitvoering via
      # EXTRACTIE_WACHTRIJ_JOB_RESOURCE (run-backend@ roles/run.invoker, f3_jobs.sh stap 8);
      # de job werkt álle wachtrij-documenten synchroon af (systeem-actor). Het ANTHROPIC_API_KEY-
      # secret hangt ná de lus aan déze job (alleen deze job doet AI-calls).
      # rlz-eerste-sync (feedbackronde 26-08 punt 5, "Administratie toevoegen"-wizard): ON-DEMAND,
      # géén scheduler — de wizard zet een administratie_sync_run klaar en triggert één
      # uitvoering via EERSTE_SYNC_JOB_RESOURCE (run-backend@ roles/run.invoker, f3_jobs.sh
      # stap 9); status per onderdeel via …/eerste-sync/status.
      # rlz-projecten-cijfers is ON-DEMAND (géén scheduler): de sync-knop zet een wachtrij-rij
      # klaar en triggert één uitvoering via CIJFERS_SYNC_JOB_RESOURCE op de service
      # (achtergrondrun-fix 2026-08-23; run-backend@ heeft roles/run.invoker op déze job —
      # eenmalig gezet, zie f3_jobs.sh stap 6). De dagelijkse verversing zit in rlz-sync.
      # run-jobs@ + alléén het app-DB-wachtwoord (least privilege); masterkey-unwrap loopt
      # via KMS (credential-store), TOTP-secret is hier niet nodig. De rlz-intake-imap-job
      # krijgt ná de lus zijn INTAKE_IMAP_*-envs + wachtwoord-secret (F3.4, geactiveerd
      # 2026-08-15 na de Workspace-DPA-check): --set-env-vars in de lus VERVANGT de hele
      # envset, dus de update-stap moet ná elke deploy opnieuw draaien — vandaar in dezelfde
      # step, direct erachter.
      - name: F3-jobs bijwerken (zelfde beeld, CLI-entrypoints)
        run: |
          for JOB in \
            "rlz-sync|sync-alles|3600" \
            "rlz-reconciliatie|reconciliatie-alles|3600" \
            "rlz-intake-imap|intake-postvak-verwerken|900" \
            "rlz-accordeur-herinneringen|accordeur-herinneringen|600" \
            "rlz-nieuwe-facturen|nieuwe-facturen-melden|600" \
            "rlz-projecten-cijfers|projecten-cijfers-wachtrij|3600" \
            "rlz-bank-sync|bank-sync-wachtrij|900" \
            "rlz-extractie-wachtrij|extractie-wachtrij-verwerken|1800" \
            "rlz-eerste-sync|eerste-sync-wachtrij|1800" \
          ; do
            NAAM="${JOB%%|*}"; REST="${JOB#*|}"; CLI="${REST%%|*}"; TIMEOUT="${REST##*|}"
            gcloud run jobs deploy "${NAAM}" \
              --image "${IMAGE}:${GITHUB_SHA}" \
              --region "${REGION}" \
              --project "${PROJECT_ID}" \
              --service-account "run-jobs@${PROJECT_ID}.iam.gserviceaccount.com" \
              --set-cloudsql-instances "${CLOUD_SQL}" \
              --set-env-vars "ENVIRONMENT=production,CLOUD_SQL_VERBINDING=${CLOUD_SQL},DOCUMENT_GCS_BUCKET=rlz-boekhouding-documenten,KMS_MASTERKEY_SLEUTEL=projects/${PROJECT_ID}/locations/${REGION}/keyRings/rlz/cryptoKeys/masterkey" \
              --set-secrets "APP_DB_WACHTWOORD=APP_DB_PASSWORD:latest" \
              --command python \
              --args="-m,app.cli,${CLI}" \
              --max-retries 0 \
              --task-timeout "${TIMEOUT}" \
              --quiet
          done
          # Extractie-wachtrij-job: als enige job de Claude-API-key (least privilege — de andere
          # jobs doen geen AI-calls). --update-secrets laat de envset uit de lus intact.
          gcloud run jobs update rlz-extractie-wachtrij \
            --region "${REGION}" \
            --project "${PROJECT_ID}" \
            --update-secrets "ANTHROPIC_API_KEY=ANTHROPIC_API_KEY:latest" \
            --quiet
          # F4 — webhook-afleveraar (activatie-editie 2026-08-24, runbook stap 8 + SA-grant-
          # route): eigen deploy-blok BUITEN de lus — alléén deze job draagt het uitgaande
          # HMAC-secret en de doel-URL (least privilege). WEBHOOK_HMAC_SECRET mount
          # cross-project Vastly's slot WEBHOOK_RLZ_SECRET in vastly-504108 (⚠️ naamverschil,
          # zelfde waarde — runbook "Update vastgoed 21-08"); accessors voor onze
          # run-jobs@/run-backend@ zijn door vastgoed gezet en 24-08 herbevestigd
          # (één enabled versie, waardevrij geverifieerd). NB cross-project-secrets
          # vereisen het projectNÚMMER in het pad (755625271889 = vastly-504108) —
          # het project-id weigert gcloud ("not a valid secret name", les 24-08).
          gcloud run jobs deploy rlz-webhook-afleveraar \
            --image "${IMAGE}:${GITHUB_SHA}" \
            --region "${REGION}" \
            --project "${PROJECT_ID}" \
            --service-account "run-jobs@${PROJECT_ID}.iam.gserviceaccount.com" \
            --set-cloudsql-instances "${CLOUD_SQL}" \
            --set-env-vars "ENVIRONMENT=production,CLOUD_SQL_VERBINDING=${CLOUD_SQL},DOCUMENT_GCS_BUCKET=rlz-boekhouding-documenten,KMS_MASTERKEY_SLEUTEL=projects/${PROJECT_ID}/locations/${REGION}/keyRings/rlz/cryptoKeys/masterkey,WEBHOOK_DOEL_URL=https://api.vastly.software/webhooks/rlz" \
            --set-secrets "APP_DB_WACHTWOORD=APP_DB_PASSWORD:latest,WEBHOOK_HMAC_SECRET=projects/755625271889/secrets/WEBHOOK_RLZ_SECRET:latest" \
            --command python \
            --args="-m,app.cli,webhook-afleveren" \
            --max-retries 0 \
            --task-timeout 600 \
            --quiet
          # F3.4 — live IMAP-intake (facturen@ak-nijenhuis.nl op Google Workspace, SSL 993).
          # Het app-wachtwoord leeft uitsluitend in Secret Manager (INTAKE_IMAP_WACHTWOORD,
          # versie door Peter); de scheduler-pauze is de aan/uit-knop van de fetch.
          # ANTHROPIC_API_KEY (2026-08-25): dít is de enige job die intake-AI draait
          # (extractie + multi-factuur-splitsing achter de intake_ai-gate + kostengrens) —
          # daarom hier en niet in de lus.
          gcloud run jobs update rlz-intake-imap \
            --region "${REGION}" \
            --project "${PROJECT_ID}" \
            --update-env-vars "INTAKE_IMAP_HOST=imap.gmail.com,INTAKE_IMAP_POORT=993,INTAKE_IMAP_GEBRUIKER=facturen@ak-nijenhuis.nl,INTAKE_POSTVAK_ADRES=facturen@ak-nijenhuis.nl" \
            --update-secrets "INTAKE_IMAP_WACHTWOORD=INTAKE_IMAP_WACHTWOORD:latest,ANTHROPIC_API_KEY=ANTHROPIC_API_KEY:latest" \
            --quiet
          # Accordeur-notificaties (berichten-bouwsteen 2026-08-15): SMTP-mail (Google
          # Workspace, app-wachtwoord) + Web Push (VAPID). Secret-slots + accessors komen uit
          # scripts/gcp/notificaties_infra.sh (owner); zolang die nog niet gedraaid is, faalt
          # deze update — dan alleen een zichtbare LET-OP, geen rode deploy (de job draait dan
          # geconfigureerd-loos: mail/push falen fail-zichtbaar, nooit stil). Afzenderadres
          # (besluit Peter 2026-08-15): facturen@ak-nijenhuis.nl — géén aparte gebruiker/
          # licentie; Reply-To p.nijenhuis@kempengroep.nl houdt menselijke antwoorden buiten
          # het intake-postvak, auto-replies dáár zijn geaccepteerde zichtbare ruis.
          gcloud run jobs update rlz-accordeur-herinneringen \
            --region "${REGION}" \
            --project "${PROJECT_ID}" \
            --update-env-vars "BERICHTEN_SMTP_HOST=smtp.gmail.com,BERICHTEN_SMTP_POORT=465,BERICHTEN_SMTP_GEBRUIKER=facturen@ak-nijenhuis.nl,BERICHTEN_AFZENDER=facturen@ak-nijenhuis.nl,BERICHTEN_REPLY_TO=p.nijenhuis@kempengroep.nl,APP_BASIS_URL=https://app.administratiekantoornijenhuis.nl" \
            --update-secrets "BERICHTEN_SMTP_WACHTWOORD=BERICHTEN_SMTP_WACHTWOORD:latest,PUSH_VAPID_PRIVATE_KEY=PUSH_VAPID_PRIVATE_KEY:latest,PUSH_VAPID_PUBLIC_KEY=PUSH_VAPID_PUBLIC_KEY:latest" \
            --quiet \
          || echo "LET OP: notificatie-secrets nog niet klaargezet (scripts/gcp/notificaties_infra.sh) — rlz-accordeur-herinneringen draait zonder mail-/pushconfig (fail-zichtbaar)."
          # Nieuwe-facturen-bundelmelding (besluit Peter 2026-08-16): zelfde notificatie-config
          # als de dagelijkse herinnering (mail + push + app-basis-url), zelfde LET-OP-terugval.
          gcloud run jobs update rlz-nieuwe-facturen \
            --region "${REGION}" \
            --project "${PROJECT_ID}" \
            --update-env-vars "BERICHTEN_SMTP_HOST=smtp.gmail.com,BERICHTEN_SMTP_POORT=465,BERICHTEN_SMTP_GEBRUIKER=facturen@ak-nijenhuis.nl,BERICHTEN_AFZENDER=facturen@ak-nijenhuis.nl,BERICHTEN_REPLY_TO=p.nijenhuis@kempengroep.nl,APP_BASIS_URL=https://app.administratiekantoornijenhuis.nl" \
            --update-secrets "BERICHTEN_SMTP_WACHTWOORD=BERICHTEN_SMTP_WACHTWOORD:latest,PUSH_VAPID_PRIVATE_KEY=PUSH_VAPID_PRIVATE_KEY:latest,PUSH_VAPID_PUBLIC_KEY=PUSH_VAPID_PUBLIC_KEY:latest" \
            --quiet \
          || echo "LET OP: notificatie-secrets nog niet klaargezet — rlz-nieuwe-facturen draait zonder mail-/pushconfig (fail-zichtbaar)."
          # Native push fase 3 (kliktest-ronde 2026-08-17): APNs op de twee notificatie-jobs.
          # APNS_KEY_P8 + APNS_KEY_ID zijn Secret Manager-slots (scripts/gcp/apns_afronden.sh
          # — het Key ID is geen geheim maar leeft dáár zodat deploy.yml waarde-vrij blijft).
          # APNS_SANDBOX=false sinds A6 (2026-08-21): de TestFlight-build is de doel-build
          # (aps-environment 'production'); push op de oude dev-signed kabel-build werkt
          # daarmee bewust niet meer — dit is dezelfde omslag als het provisioning-profiel maakt.
          # FCM (Android, bouwronde 28-08): Firebase zit in ditzelfde GCP-project, de verzendkant
          # gebruikt Application Default Credentials van run-jobs@ (IAM
          # roles/firebasecloudmessaging.admin — scripts/gcp/fcm_afronden.sh, eenmalig owner) —
          # geen secret; FCM_PROJECT_ID is de enige config en is geen geheim.
          for NJOB in rlz-accordeur-herinneringen rlz-nieuwe-facturen; do
            gcloud run jobs update "${NJOB}" \
              --region "${REGION}" \
              --project "${PROJECT_ID}" \
              --update-env-vars "APNS_SANDBOX=false,APPLE_TEAM_ID=VRQP26CX43,FCM_PROJECT_ID=${PROJECT_ID}" \
              --update-secrets "APNS_KEY_P8=APNS_KEY_P8:latest,APNS_KEY_ID=APNS_KEY_ID:latest" \
              --quiet \
            || echo "LET OP: APNs-secrets nog niet klaargezet (scripts/gcp/apns_afronden.sh) — ${NJOB} verstuurt native push nog niet (webpush/mail ongemoeid)."
          done

      # Notificatie-config op de service (uitnodigingsmail via de API + het volledige
      # VAPID-paar). "Private key alléén op de job" (least privilege, notificaties-uitrol
      # 2026-08-15) is HERZIEN 2026-08-17: de handmatige herinner-knop (migratie 0053)
      # verstuurt per direct vanuit de service — zonder private key werd webpush daar stil
      # overgeslagen en strandde de bewijs-push op de mail-terugval. Aparte update-stap:
      # --update-* raakt de bestaande envset niet, en zolang de secret-slots ontbreken faalt
      # alleen deze stap zichtbaar terwijl de vorige revisie live blijft —
      # mail_verzonden=false + mail_fout in de uitnodiging-respons is dan de terugval.
      - name: Notificatie-config service (mail + VAPID-paar)
        run: |
          gcloud run services update rlz-backend \
            --region "${REGION}" \
            --project "${PROJECT_ID}" \
            --update-env-vars "BERICHTEN_SMTP_HOST=smtp.gmail.com,BERICHTEN_SMTP_POORT=465,BERICHTEN_SMTP_GEBRUIKER=facturen@ak-nijenhuis.nl,BERICHTEN_AFZENDER=facturen@ak-nijenhuis.nl,BERICHTEN_REPLY_TO=p.nijenhuis@kempengroep.nl,APP_BASIS_URL=https://app.administratiekantoornijenhuis.nl" \
            --update-secrets "BERICHTEN_SMTP_WACHTWOORD=BERICHTEN_SMTP_WACHTWOORD:latest,PUSH_VAPID_PRIVATE_KEY=PUSH_VAPID_PRIVATE_KEY:latest,PUSH_VAPID_PUBLIC_KEY=PUSH_VAPID_PUBLIC_KEY:latest" \
            --quiet \
          || echo "LET OP: notificatie-secrets nog niet klaargezet (scripts/gcp/notificaties_infra.sh) — service draait zonder mail-/pushconfig (fail-zichtbaar: uitnodiging-respons meldt mail_fout, push-config-endpoint geeft null)."
          # APNs óók op de service: het native-registratie-endpoint is fail-closed 409 zolang
          # APNs daar niet geconfigureerd is, en de handmatige herinner-knop verstuurt per
          # direct vanuit de service. Eigen || zodat een ontbrekend APNs-slot de mailconfig
          # hierboven niet meesleept. APNS_SANDBOX: zie de job-stap (TestFlight = false, A6).
          # FCM_PROJECT_ID: Android-registratie (POST …/subscripties/native soort=fcm) is
          # fail-closed 409 zolang FCM hier niet geconfigureerd is; ADC = run-backend@ (zie job-stap).
          gcloud run services update rlz-backend \
            --region "${REGION}" \
            --project "${PROJECT_ID}" \
            --update-env-vars "APNS_SANDBOX=false,FCM_PROJECT_ID=${PROJECT_ID}" \
            --update-secrets "APNS_KEY_P8=APNS_KEY_P8:latest,APNS_KEY_ID=APNS_KEY_ID:latest" \
            --quiet \
          || echo "LET OP: APNs-secrets nog niet klaargezet (scripts/gcp/apns_afronden.sh) — native-pushregistratie blijft fail-closed 409, web/PWA ongemoeid."
