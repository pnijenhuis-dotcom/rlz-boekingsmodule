# Nameting-workflow (werkloop automatisch — besluit Peter 14-09: "alles wat automatisch kan gaat automatisch").
# Draait de lees-only productie-nametingen dagelijks (05:30 UTC = 07:30 NL) en op verzoek (workflow_dispatch met
# input "onderdeel") en commit de uitkomstbestanden als nameting-bot terug naar main.
#
# Auth: Workload Identity Federation met DEZELFDE provider als deploy.yml, maar als serviceaccount
# nameting@rlz-boekhouding (lees-only: run.viewer + logging.viewer + custom rol nametingUitvoerder job-scoped op
# rlz-reconciliatie — nooit deploy@, nooit een SA-key). De WIF-binding op nameting@ zet Peter eenmalig als owner met
# scripts/gcp/nameting_wif_iam.sh --apply; daarmee vervalt het beslispunt "SA-key" van 10-09 (org-policy) definitief.
#
# Alle productie-aanroepen lopen UITSLUITEND via scripts/gcp/vgg_blok7_nameting.sh en scripts/gcp/nameting.sh
# (lees-only allowlist) — nooit een directe `gcloud run jobs execute` in deze file (guard:
# backend/tests/unit/test_nameting_workflow.py). scripts/gcp/nameting_env.sh herkent GITHUB_ACTIONS=true en zet dan
# géén impersonatie-vlag (de runner IS het SA).
#
# Een ROOD rapport is een uitkomst, geen workflow-fout (exit 0). Alleen de deploy-check (service ≠ jobs, exit 3 uit
# vgg_blok7_nameting.sh) en auth-/executiefouten (geen job-executie gestart) maken de run rood.
#
# Commit: alleen verkenning/nameting-*.txt, gebruiker nameting-bot, push met GITHUB_TOKEN (contents: write). Een push
# met GITHUB_TOKEN start geen nieuwe workflow-run (GitHub-regel) — de deploy-workflow blijft dus stil op zo'n commit.
# Geen wijzigingen = geen commit. Uitzetten: GitHub → Actions → nameting → "Disable workflow".

name: nameting

on:
  schedule:
    - cron: "30 5 * * *"
  workflow_dispatch:
    inputs:
      onderdeel:
        description: "Welk onderdeel (alles | a schoonlijst | b panden | c replay | d rlz_dubbel snede 2 | e memoriaalregels | reconciliatie | btw-default | doorbelasting-aansluiting | app-bundels | projecten-afgesloten | groep-saldi | bua-kandidaten | veldwerkers-dubbelen | jobs-start | btw-niet-plichtig)"
        type: choice
        default: alles
        options: [alles, a, b, c, d, e, reconciliatie, btw-default, doorbelasting-aansluiting, app-bundels, query, projecten-afgesloten, groep-saldi, bua-kandidaten, veldwerkers-dubbelen, jobs-start, corrigeren, btw-niet-plichtig]
      query:
        description: "Bij onderdeel=query: db-lezen-aanroep, bv. 'document-feiten --param boekstuk=RLZ-28-00000061' of 'bankmutatie-feiten --administratie Vastgoedgroep --param omschrijving=test' (lees-only querybibliotheek; uitkomst → verkenning/lezen-<dd-mm>-<query>.txt)"
        type: string
        required: false
        default: ""

env:
  PROJECT_ID: rlz-boekhouding
  PROJECT_NUMBER: "652591056217"
  REGION: europe-west4

permissions:
  contents: write # commit + push van verkenning/nameting-*.txt
  id-token: write # vereist voor WIF (OIDC-token richting Google STS)

concurrency:
  group: nameting-production
  cancel-in-progress: false

jobs:
  nameting:
    runs-on: ubuntu-latest
    # Elk onderdeel = één of meer Cloud Run-job-executies mét --wait; "alles" doet er ~17 (e alleen al 12 rlz-lezen-calls).
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Authenticatie via WIF als nameting@ (geen SA-keys, nooit het deploy-SA)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/${{ env.PROJECT_NUMBER }}/locations/global/workloadIdentityPools/github/providers/github-oidc
          service_account: nameting@${{ env.PROJECT_ID }}.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v2

      - name: Nameting draaien (lees-only, via de nameting-scripts)
        id: meting
        env:
          ONDERDEEL: ${{ inputs.onderdeel || 'alles' }}
          QUERY: ${{ inputs.query || '' }}
        run: |
          set -uo pipefail
          DATUM="$(TZ=Europe/Amsterdam date +%d-%m)"
          echo "onderdeel=$ONDERDEEL datum=$DATUM"
          rc_vgg=0
          # Élk niet-VGG-onderdeel staat hier uitgesloten (21-09: groep-saldi ontbrak sinds 21-09 ochtend → vgg_blok7_nameting.sh
          # weigerde 'm met exit 2 en de workflow werd rood vóór de eigen tak; guard test_nameting_workflow.py).
          if [[ "$ONDERDEEL" != "reconciliatie" && "$ONDERDEEL" != "btw-default" && "$ONDERDEEL" != "doorbelasting-aansluiting" && "$ONDERDEEL" != "app-bundels" && "$ONDERDEEL" != "query" && "$ONDERDEEL" != "projecten-afgesloten" && "$ONDERDEEL" != "groep-saldi" && "$ONDERDEEL" != "bua-kandidaten" && "$ONDERDEEL" != "veldwerkers-dubbelen" && "$ONDERDEEL" != "jobs-start" && "$ONDERDEEL" != "corrigeren" && "$ONDERDEEL" != "btw-niet-plichtig" ]]; then
            # exit 3 = deploy-drift (service ≠ jobs) → workflow rood; een rood rapport geeft het script zelf exit 0.
            scripts/gcp/vgg_blok7_nameting.sh "$ONDERDEEL" || rc_vgg=$?
            if [[ $rc_vgg -ne 0 ]]; then
              echo "::error::vgg_blok7_nameting.sh eindigde met code $rc_vgg (3 = deploy-drift, anders auth-/executiefout)"
              exit "$rc_vgg"
            fi
          fi
          if [[ "$ONDERDEEL" == "alles" || "$ONDERDEEL" == "reconciliatie" ]]; then
            UIT="verkenning/nameting-reconciliatie-$DATUM.txt"
            rc_rec=0
            scripts/gcp/nameting.sh reconciliatie-alles --lees-only > "$UIT" 2> nameting-reconciliatie.stderr || rc_rec=$?
            cat nameting-reconciliatie.stderr >&2
            # Auth-/executiefout = geen job-executie gestart → rood. Een rode job-executie (afwijkingen gemeld) = uitkomst.
            if grep -q "geen executie-naam gevonden\|PERMISSION_DENIED\|Reauthentication\|does not have permission" nameting-reconciliatie.stderr; then
              echo "::error::reconciliatie-alles --lees-only kon geen job-executie starten (auth/IAM) — zie stderr hierboven"
              exit 1
            fi
            [[ -s "$UIT" ]] || echo "(lege uitvoer — job-executie eindigde met code $rc_rec)" >> "$UIT"
            echo "STATUS reconciliatie: rapport in $UIT (job-exit $rc_rec = uitkomst)"
          fi
          if [[ "$ONDERDEEL" == "alles" || "$ONDERDEEL" == "btw-default" ]]; then
            # Btw-default per grootboekrekening uit de historie (vervolg 14-09, migratie 0143) — lees-only meetrecept
            # "werkt in productie": staat op LHG 4404 een historie-default? Twee administraties uit de opdracht; een
            # rode job-executie (bv. administratie onbekend) is een uitkomst, alleen auth/IAM maakt de run rood.
            for adm in "L.H.G. Holding" "Universal Steigerbouw"; do
              SLUG="$(tr '[:upper:] .' '[:lower:]--' <<<"$adm" | tr -s '-' | sed 's/-$//')"
              UIT="verkenning/nameting-btw-default-$SLUG-$DATUM.txt"
              rc_btw=0
              scripts/gcp/nameting.sh btw-default-rapport --administratie "$adm" > "$UIT" 2> nameting-btw-default.stderr || rc_btw=$?
              cat nameting-btw-default.stderr >&2
              if grep -q "geen executie-naam gevonden\|PERMISSION_DENIED\|Reauthentication\|does not have permission" nameting-btw-default.stderr; then
                echo "::error::btw-default-rapport ($adm) kon geen job-executie starten (auth/IAM) — zie stderr hierboven"
                exit 1
              fi
              [[ -s "$UIT" ]] || echo "(lege uitvoer — job-executie eindigde met code $rc_btw)" >> "$UIT"
              echo "STATUS btw-default ($adm): rapport in $UIT (job-exit $rc_btw = uitkomst)"
            done
          fi
          if [[ "$ONDERDEEL" == "doorbelasting-aansluiting" ]]; then
            # Doorbelasting-aansluiting KF ↔ doelentiteiten (Peter 12-09/16-09; nameting 17-09): alleen op verzoek (niet in "alles" —
            # de dagelijkse reconciliatie draait hetzelfde blok al). Lees-only CLI op de job-image; exit 3 = webfilter → het rapport zegt
            # zelf "meting ongeldig". Daarna de herkoppeling-regel van de laatste sync-alles-runs (job rlz-sync) uit Cloud Logging
            # (logging.viewer op nameting@) achter het CLI-rapport — verwacht "Kempen Chalets" GEKOPPELD.
            UIT="verkenning/nameting-doorbelasting-aansluiting-$DATUM.txt"
            rc_da=0
            scripts/gcp/nameting.sh doorbelasting-aansluiting --bron "Kempen Facilities" --jaar 2026 > "$UIT" 2> nameting-da.stderr || rc_da=$?
            cat nameting-da.stderr >&2
            if grep -q "geen executie-naam gevonden\|PERMISSION_DENIED\|Reauthentication\|does not have permission" nameting-da.stderr; then
              echo "::error::doorbelasting-aansluiting kon geen job-executie starten (auth/IAM) — zie stderr hierboven"
              exit 1
            fi
            [[ -s "$UIT" ]] || echo "(lege uitvoer — job-executie eindigde met code $rc_da)" >> "$UIT"
            {
              echo
              echo "== Cloud Logging: herkoppeling doelentiteiten (job rlz-sync, laatste 7 dagen, nieuwste eerst) =="
              gcloud logging read 'resource.type="cloud_run_job" AND resource.labels.job_name="rlz-sync" AND (textPayload:"herkoppeling doelentiteiten" OR textPayload:"GEKOPPELD" OR textPayload:"LET-OP")' \
                --project "$PROJECT_ID" --freshness=7d --limit 60 --order=desc --format="value(timestamp,textPayload)" \
                || echo "(Cloud Logging niet leesbaar — herkoppeling-regel niet gemeten)"
            } >> "$UIT"
            echo "STATUS doorbelasting-aansluiting: rapport in $UIT (job-exit $rc_da = uitkomst; 3 = webfilter, meting ongeldig)"
          fi
          if [[ "$ONDERDEEL" == "app-bundels" ]]; then
            # Native app OTA (Peter 16-09; nameting 17-09 — gcloud-sessie verlopen in de inbox-run): alleen op verzoek (niet in "alles").
            # Lees-only: (1) publiek manifest per platform voor de huidige runtime (= APP_MARKETING_VERSIE uit appVersie.ts, zelfde
            # bron als de deploy-stap), (2) de 426-poort mét een te oude aangekondigde schil, (3) de geregistreerde bundels via de
            # lees-only CLI `app-bundels` op de job-image. Oordeelregel: manifest draagt een bundel_id én die staat actief in de
            # lijst → "OTA-bundel geserveerd"; anders "geen bundel" (bucket-stap van de deploy nog niet gelopen — klikpunt Peter).
            UIT="verkenning/nameting-app-bundels-$DATUM.txt"
            rc_ab=0
            RUNTIME="$(sed -n "s/^export const APP_MARKETING_VERSIE = '\([0-9.]*\)'.*/\1/p" frontend/src/accordeur/appVersie.ts)"
            BASIS="https://app.administratiekantoornijenhuis.nl"
            MANIFEST_IOS="$(curl -sS --max-time 20 "$BASIS/app/update-manifest?runtime=$RUNTIME&platform=ios" || echo '(manifest niet bereikbaar)')"
            MANIFEST_AND="$(curl -sS --max-time 20 "$BASIS/app/update-manifest?runtime=$RUNTIME&platform=android" || echo '(manifest niet bereikbaar)')"
            CODE_426="$(curl -sS --max-time 20 -o /dev/null -w '%{http_code}' -H 'X-Native-Client: 1' -H 'X-App-Versie: 0.9' -H 'X-App-Platform: ios' "$BASIS/accordering/wachtrij" || echo '000')"
            {
              echo "== OTA-nameting $DATUM (lees-only) — runtime $RUNTIME =="
              echo "manifest ios:     $MANIFEST_IOS"
              echo "manifest android: $MANIFEST_AND"
              echo "426-poort (schil 0.9, ios): HTTP $CODE_426 (verwacht 426)"
              echo "== Geregistreerde bundels (CLI app-bundels, job-image) =="
            } > "$UIT"
            scripts/gcp/nameting.sh app-bundels >> "$UIT" 2> nameting-ab.stderr || rc_ab=$?
            cat nameting-ab.stderr >&2
            if grep -q "geen executie-naam gevonden\|PERMISSION_DENIED\|Reauthentication\|does not have permission" nameting-ab.stderr; then
              echo "::error::app-bundels kon geen job-executie starten (auth/IAM) — zie stderr hierboven"
              exit 1
            fi
            BUNDEL_ID="$(printf '%s' "$MANIFEST_IOS" | sed -n 's/.*"bundel_id":"\([^"]*\)".*/\1/p')"
            if [[ -n "$BUNDEL_ID" ]] && grep -q "actief $BUNDEL_ID " "$UIT"; then
              echo "Oordeel: OTA-bundel $BUNDEL_ID geserveerd voor runtime $RUNTIME — 426-poort HTTP $CODE_426" >> "$UIT"
            elif [[ -n "$BUNDEL_ID" ]]; then
              echo "Oordeel: manifest geeft $BUNDEL_ID maar de bundellijst toont 'm niet actief — controleren" >> "$UIT"
            else
              echo "Oordeel: geen bundel voor runtime $RUNTIME — bucket-stap van de deploy nog niet gelopen (klikpunt app_bundels_bucket.sh) — 426-poort HTTP $CODE_426" >> "$UIT"
            fi
            echo "STATUS app-bundels: rapport in $UIT (job-exit $rc_ab)"
          fi
          if [[ "$ONDERDEEL" == "projecten-afgesloten" ]]; then
            # Opdracht 19-09 (nazorg facturen zonder project 18-09): alleen op verzoek (niet in "alles"). Lees-only CLI's op de
            # job-image: (1) RLZ-kant facturen zonder project voor Universal + alle project-verplichte administraties (--rlz =
            # uitsluitend GET), (2) projectverdeling × afgesloten projecten (geboekte delen op 'Afgesloten'-projecten, LET-OP-lijst,
            # overhead via de sleutel). Oordeelregel: het aantal actieve 'Afgesloten'-projecten uit het tweede rapport.
            UIT="verkenning/nameting-projecten-afgesloten-$DATUM.txt"
            rc_pa=0
            {
              echo "== facturen-zonder-project Universal Steigerbouw 2026 --rlz (alleen GET) =="
              scripts/gcp/nameting.sh facturen-zonder-project --administratie "Universal Steigerbouw" --jaar 2026 --rlz 2> nameting-pa.stderr || rc_pa=$?
              echo "== facturen-zonder-project --alle-projectverplicht 2026 --rlz (alleen GET) =="
              scripts/gcp/nameting.sh facturen-zonder-project --alle-projectverplicht --jaar 2026 --rlz 2>> nameting-pa.stderr || rc_pa=$?
              echo "== projectverdeling-afgesloten-rapport --alle-projectverplicht =="
              scripts/gcp/nameting.sh projectverdeling-afgesloten-rapport --alle-projectverplicht 2>> nameting-pa.stderr || rc_pa=$?
              echo "== projecten-afsluit-kandidaten Universal Steigerbouw (tab Afsluiten? — opdracht 19-09) =="
              scripts/gcp/nameting.sh projecten-afsluit-kandidaten --administratie "Universal Steigerbouw" 2>> nameting-pa.stderr || rc_pa=$?
              # Opdracht 19-09 "projectnummer uit Afgesloten-naam": dubbele nummers óók ná het afsluitwoord — verwacht bij Universal
              # 4 × project_nummer_dubbel (26053, 26064, 26084, 26149) en 26064 mét beide kanten in het CLI-rapport. Lees-only.
              echo "== reconciliatie-alles --alleen projecten --lees-only (project_nummer_dubbel incl. 'Afgesloten NNNNN' — opdracht 19-09) =="
              scripts/gcp/nameting.sh reconciliatie-alles --alleen projecten --lees-only 2>> nameting-pa.stderr || rc_pa=$?
              echo "== projecten-dubbele-nummers Universal Steigerbouw =="
              scripts/gcp/nameting.sh projecten-dubbele-nummers --administratie "Universal Steigerbouw" 2>> nameting-pa.stderr || rc_pa=$?
            } > "$UIT"
            cat nameting-pa.stderr >&2
            if grep -q "geen executie-naam gevonden\|PERMISSION_DENIED\|Reauthentication\|does not have permission" nameting-pa.stderr; then
              echo "::error::projecten-afgesloten kon geen job-executie starten (auth/IAM) — zie stderr hierboven"
              exit 1
            fi
            [[ -s "$UIT" ]] || echo "(lege uitvoer — job-executie eindigde met code $rc_pa)" >> "$UIT"
            TOT="$(grep -m1 -o "Totaal: [0-9]* actief project(en) mét 'Afgesloten'-naam, [0-9]* geboekt(e) verdelingsdeel(en)" "$UIT" || true)"
            KAND="$(grep -m1 -o "Totaal: [0-9]* lopende projecten beoordeeld, [0-9]* kandidaat afsluiten" "$UIT" || true)"
            echo "Oordeel: ${TOT:-geen totaalregel} · ${KAND:-geen kandidatenregel} — job-exit $rc_pa" >> "$UIT"
            echo "STATUS projecten-afgesloten: rapport in $UIT (job-exit $rc_pa = uitkomst)"
          fi
          if [[ "$ONDERDEEL" == "groep-saldi" ]]; then
            # BUG 21-09 (groepssaldi 16→21-09: 35/35 leden `fout` — RLZ-enumfilter + Odoo `deprecated`): alleen op verzoek.
            # Lees-only CLI op de job-image, twee vormen uit het meetrecept: (1) LIVE meting van "Kempen groep" (het antwoord op
            # Peters vraag van 16-09: bruto / IC / zonder IC per lid + totaal, geen debiteur-/crediteurnamen), (2) de NACHTELIJKE
            # stand (`--stand`, cache uit sync-alles) van de volgende ochtend. Oordeelregel: de TOTAAL-regel + het aantal
            # niet-ok-leden; verwacht 35 × ok (of geen_rekening/overgeslagen mét reden), 0 × fout.
            UIT="verkenning/nameting-groep-saldi-$DATUM.txt"
            rc_gs=0
            {
              echo "== groep-saldi --groep 'Kempen groep' (LIVE, lees-only) =="
              scripts/gcp/nameting.sh groep-saldi --groep "Kempen groep" 2> nameting-gs.stderr || rc_gs=$?
              echo "== groep-saldi --groep 'Kempen groep' --stand (nachtelijke stand uit sync-alles) =="
              scripts/gcp/nameting.sh groep-saldi --groep "Kempen groep" --stand 2>> nameting-gs.stderr || rc_gs=$?
            } > "$UIT"
            cat nameting-gs.stderr >&2
            if grep -q "geen executie-naam gevonden\|PERMISSION_DENIED\|Reauthentication\|does not have permission" nameting-gs.stderr; then
              echo "::error::groep-saldi kon geen job-executie starten (auth/IAM) — zie stderr hierboven"
              exit 1
            fi
            [[ -s "$UIT" ]] || echo "(lege uitvoer — job-executie eindigde met code $rc_gs)" >> "$UIT"
            TOTAAL="$(grep -m1 -o 'TOTAAL ([0-9]* geldig)' "$UIT" || true)"
            NIET_OK="$(grep -m1 -o 'LET OP: [0-9]* administratie(s) niet in het totaal' "$UIT" || true)"
            FOUT="$(grep -c '  fout' "$UIT" || true)"
            echo "Oordeel: ${TOTAAL:-geen totaalregel} · ${NIET_OK:-alle leden in het totaal} · ${FOUT:-0} regel(s) status fout — job-exit $rc_gs" >> "$UIT"
            echo "STATUS groep-saldi: rapport in $UIT (job-exit $rc_gs = uitkomst)"
          fi
          if [[ "$ONDERDEEL" == "bua-kandidaten" ]]; then
            # BUA 21-09 (opdracht Peter): kantoorbrede lees-only meting van de BUA-kandidaat-rekeningen (kenmerk-stand,
            # RLZ-/historie-default, module- en bank-geboekt 2026, advies per rekening) — alleen op verzoek, geen RLZ-call.
            # Meetrecept "werkt in productie": TOTAAL-regel mét 0 fouten; ná `bua-kenmerk-zetten` (aparte job-stap ná Peters
            # "ja") toont dezelfde meting "N mét kenmerk aan" = het aantal gezette rekeningen.
            UIT="verkenning/nameting-bua-kandidaten-$DATUM.txt"
            rc_bua=0
            {
              echo "== bua-kandidaten --jaar 2026 --detail (lees-only, kantoorbreed) =="
              scripts/gcp/nameting.sh bua-kandidaten --jaar 2026 --detail 2> nameting-bua.stderr || rc_bua=$?
            } > "$UIT"
            cat nameting-bua.stderr >&2
            if grep -q "geen executie-naam gevonden\|PERMISSION_DENIED\|Reauthentication\|does not have permission" nameting-bua.stderr; then
              echo "::error::bua-kandidaten kon geen job-executie starten (auth/IAM) — zie stderr hierboven"
              exit 1
            fi
            [[ -s "$UIT" ]] || echo "(lege uitvoer — job-executie eindigde met code $rc_bua)" >> "$UIT"
            TOTAAL="$(grep -m1 -o 'TOTAAL [0-9]* kandidaat-rekening(en) in [0-9]* van [0-9]* administratie(s) · [0-9]* mét kenmerk aan · advies zetten: [0-9]*' "$UIT" || true)"
            FOUTEN="$(grep -m1 -o '[0-9]* fout(en)' "$UIT" || true)"
            echo "Oordeel: ${TOTAAL:-geen totaalregel} · ${FOUTEN:-fouten onbekend} — job-exit $rc_bua" >> "$UIT"
            echo "STATUS bua-kandidaten: rapport in $UIT (job-exit $rc_bua = uitkomst)"
          fi
          if [[ "$ONDERDEEL" == "btw-niet-plichtig" ]]; then
            # 22-09 (BUG Peter, casus VGG / Studio Lacy Lion): lees-only nazorgrapport — module-geboekte inkoopfacturen 2026 mét
            # btw ≠ 0 in Vastgoedgroep Nederland + RLZ-crediteurpost/betaald/open per document (uitsluitend GET) → kolom
            # TE WEINIG (Peters nabetaallijst) + het aantal ingediende aangiften (aangiftepoort n.v.t.), plus de detector-lijst
            # `btw-plichtig-kandidaten`. Meetrecept "werkt in productie": een TOTAAL-regel + Lacy Lion (2026-042) mét TE WEINIG
            # 322.38 zolang het document niet gecorrigeerd is; ná Peters klik 0.00.
            UIT="verkenning/nameting-btw-niet-plichtig-$DATUM.txt"
            rc_bnp=0
            {
              echo "== btw-in-niet-plichtige-administratie --administratie Vastgoedgroep --jaar 2026 --rlz (lees-only, GET) =="
              scripts/gcp/nameting.sh btw-in-niet-plichtige-administratie --administratie "Vastgoedgroep" --jaar 2026 --rlz 2> nameting-bnp.stderr || rc_bnp=$?
              echo
              echo "== btw-plichtig-kandidaten (lees-only) =="
              scripts/gcp/nameting.sh btw-plichtig-kandidaten 2>> nameting-bnp.stderr || rc_bnp=$?
            } > "$UIT"
            cat nameting-bnp.stderr >&2
            if grep -q "geen executie-naam gevonden\|PERMISSION_DENIED\|Reauthentication\|does not have permission" nameting-bnp.stderr; then
              echo "::error::btw-niet-plichtig kon geen job-executie starten (auth/IAM) — zie stderr hierboven"
              exit 1
            fi
            [[ -s "$UIT" ]] || echo "(lege uitvoer — job-executie eindigde met code $rc_bnp)" >> "$UIT"
            TOTAAL="$(grep -m1 -o 'TOTAAL te weinig betaald[^:]*: € [0-9.,-]*' "$UIT" || true)"
            KAND="$(grep -m1 -o 'btw-plichtig-kandidaten — [0-9]* administratie(s)' "$UIT" || true)"
            echo "Oordeel: ${TOTAAL:-geen totaalregel} · ${KAND:-kandidaten onbekend} — job-exit $rc_bnp" >> "$UIT"
            echo "STATUS btw-niet-plichtig: rapport in $UIT (job-exit $rc_bnp = uitkomst)"
          fi
          if [[ "$ONDERDEEL" == "veldwerkers-dubbelen" ]]; then
            # 21-09 (opdracht Peter, correctie "broers in één ploeg"): lees-only kandidatenrapport dubbele veldwerkers op HARDE
            # sleutels alleen (KvK, IBAN via crediteur, e-mail) over alle administraties mét uren-opt-in — alleen op verzoek,
            # geen write, geen RLZ-call. Meetrecept "werkt in productie": TOTAAL-regel mét 0 fouten (Universal: verwacht 0 clusters).
            UIT="verkenning/nameting-veldwerkers-dubbelen-$DATUM.txt"
            rc_vd=0
            {
              echo "== veldwerkers-dubbelen --alles (lees-only, harde sleutels) =="
              scripts/gcp/nameting.sh veldwerkers-dubbelen --alles 2> nameting-vd.stderr || rc_vd=$?
            } > "$UIT"
            cat nameting-vd.stderr >&2
            if grep -q "geen executie-naam gevonden\|PERMISSION_DENIED\|Reauthentication\|does not have permission" nameting-vd.stderr; then
              echo "::error::veldwerkers-dubbelen kon geen job-executie starten (auth/IAM) — zie stderr hierboven"
              exit 1
            fi
            [[ -s "$UIT" ]] || echo "(lege uitvoer — job-executie eindigde met code $rc_vd)" >> "$UIT"
            TOTAAL="$(grep -m1 -o 'TOTAAL [0-9]* kandidaat-cluster(s) over [0-9]* veldwerker(s) in [0-9]* administratie(s) · [0-9]* fout(en)' "$UIT" || true)"
            echo "Oordeel: ${TOTAAL:-geen totaalregel} — job-exit $rc_vd" >> "$UIT"
            echo "STATUS veldwerkers-dubbelen: rapport in $UIT (job-exit $rc_vd = uitkomst)"
          fi
          if [[ "$ONDERDEEL" == "jobs-start" ]]; then
            # 21-09 (BUG rlz-boek-wachtrij zonder --command python; BESLISSINGEN "F3-JOBS — COMMAND PYTHON IN DEPLOY.YML +
            # JOB-SMOKETEST + WORDT_GEBOEKT LET-OP (21-09)"): lees-only meetlat "start élke job?" — per Cloud Run-job het
            # startcommando (verwacht: python; rlz-migratie: alembic), de laatste executies van rlz-boek-wachtrij, de
            # scheduler-stand van de vangnetten (nameting@ heeft géén cloudscheduler.viewer → dan "niet leesbaar", geen fout)
            # en de wachtrij-audits via de querybibliotheek (db-lezen boek-wachtrij). Oordeel: alle jobs command=python.
            UIT="verkenning/nameting-jobs-start-$DATUM.txt"
            rc_js=0
            {
              echo "== gcloud run jobs: startcommando per job (verwacht python; rlz-migratie alembic) =="
              gcloud run jobs list --region "$REGION" --project "$PROJECT_ID" \
                --format="table(metadata.name,spec.template.spec.template.spec.containers[0].command.flatten(),spec.template.spec.template.spec.containers[0].args.flatten(),spec.template.spec.template.spec.containers[0].image.basename())" || rc_js=$?
              echo
              echo "== rlz-boek-wachtrij: laatste 8 executies =="
              gcloud run jobs executions list --job rlz-boek-wachtrij --region "$REGION" --project "$PROJECT_ID" --limit 8 \
                --format="table(metadata.name,status.completionTime,status.succeededCount,status.failedCount)" || rc_js=$?
              echo
              echo "== scheduler-stand vangnetten (ENABLED verwacht; 'niet leesbaar' = nameting@ zonder cloudscheduler.viewer) =="
              for S in rlz-boek-wachtrij rlz-extractie-wachtrij rlz-bank-sync rlz-bewaking rlz-webhook-afleveraar; do
                ST="$(gcloud scheduler jobs describe "$S" --location "$REGION" --project "$PROJECT_ID" --format="value(state)" 2>/dev/null || echo "niet leesbaar")"
                echo "$S: ${ST:-geen scheduler}"
              done
              echo
              echo "== db-lezen boek-wachtrij (7 dagen; wordt_geboekt_nu + ingediend/trigger/afgerond/opnieuw) =="
              scripts/gcp/nameting.sh db-lezen boek-wachtrij 2> nameting-js.stderr || rc_js=$?
            } > "$UIT"
            cat nameting-js.stderr >&2 2>/dev/null || true
            ZONDER="$(awk 'NR>1 && $1 ~ /^rlz-/ && $1 != "rlz-migratie" && $2 !~ /python/ {print $1}' <(sed -n '/startcommando per job/,/^$/p' "$UIT") || true)"
            if [[ -n "$ZONDER" ]]; then
              echo "Oordeel: ROOD — job(s) zonder command python: $(tr '\n' ' ' <<<"$ZONDER") — job-exit $rc_js" >> "$UIT"
            else
              echo "Oordeel: alle jobs dragen command python (rlz-migratie: alembic) — job-exit $rc_js" >> "$UIT"
            fi
            echo "STATUS jobs-start: rapport in $UIT (exit $rc_js = uitkomst)"
          fi
          if [[ "$ONDERDEEL" == "corrigeren" ]]; then
            # 22-09 (nameting "Corrigeren…" van 21-09; BESLISSINGEN "CORRIGEREN VANUIT DE MODULE — STORNO + OPNIEUW KLAARZETTEN
            # (Peter 21-09)" alinea "Gemeten 22-09"): lees-only meetlat ná het klikpunt van Peter op de RLZ-testadministratie
            # ('Administratiekantoor Nijenhuis (test)', gearchiveerd op 30-08 zonder credential — de run schrijft zelf niets).
            # (1) request-log van de corrigeer-routes sinds de deploy van 21-09 (methode/status/latency; 0 × 5xx verwacht),
            # (2) rlz-lezen van de TEST-CORRIGEREN-stukken op de testadministratie (Status 1 = gestorneerd concept, 2 = herboekt;
            # geen credential/gearchiveerd = exit 1 = uitkomst), (3) db-lezen correcties (audit document_gecorrigeerd mét reden,
            # oud boekstuk, oud extern id en de huidige stand). Oordeel: aantal POST corrigeren 200/409/5xx.
            UIT="verkenning/nameting-corrigeren-$DATUM.txt"
            rc_co=0
            {
              echo "== request-log corrigeer-toets / corrigeren sinds 2026-09-21T16:00Z (deploy c43111e, 21-09 17:59 NL) =="
              gcloud logging read 'resource.type="cloud_run_revision" resource.labels.service_name="rlz-backend" (httpRequest.requestUrl:"/corrigeren" OR httpRequest.requestUrl:"/corrigeer-toets") timestamp>="2026-09-21T16:00:00Z"' \
                --project "$PROJECT_ID" --limit 200 --order asc \
                --format='table(timestamp,httpRequest.requestMethod,httpRequest.status,httpRequest.latency,httpRequest.requestUrl)' > nameting-co-log.txt || rc_co=$?
              cat nameting-co-log.txt
              echo
              echo "== rlz-lezen PurchaseInvoices TEST-CORRIGEREN op 'Administratiekantoor Nijenhuis (test)' (exit 1 = geen credential/gearchiveerd = uitkomst) =="
              scripts/gcp/nameting.sh rlz-lezen --administratie "Nijenhuis (test)" --pad PurchaseInvoices --filter "startswith(Reference,'TEST-CORRIGEREN')" --top 20 2> nameting-co-rlz.stderr || { echo "(rlz-lezen exit $? — stderr:)"; cat nameting-co-rlz.stderr; }
              echo
              echo "== db-lezen correcties (audit document_gecorrigeerd / document_correctie_mislukt, 30 dagen) op de testadministratie =="
              scripts/gcp/nameting.sh db-lezen correcties --administratie "Nijenhuis (test)" 2> nameting-co-db.stderr || { echo "(db-lezen exit $? — stderr:)"; cat nameting-co-db.stderr; }
            } > "$UIT"
            P200="$(awk '$2=="POST" && $3=="200" && $5 ~ /\/corrigeren$/' nameting-co-log.txt | wc -l | tr -d ' ')"
            P409="$(awk '$2=="POST" && $3=="409" && $5 ~ /\/corrigeren$/' nameting-co-log.txt | wc -l | tr -d ' ')"
            P5XX="$(awk '($2=="POST" || $2=="GET") && $3 ~ /^5/' nameting-co-log.txt | wc -l | tr -d ' ')"
            if [[ "$P200" -ge 1 && "$P5XX" -eq 0 ]]; then CO_STAND="werkt in productie: ja (≥ 1 correctie mét 200, 0 × 5xx)"; elif [[ "$P5XX" -ge 1 ]]; then CO_STAND="ROOD — 5xx op de corrigeer-routes"; else CO_STAND="niet gemeten (nog geen POST corrigeren mét 200 — klikpunt Peter open)"; fi
            echo "Oordeel: POST corrigeren 200 = $P200, 409 = $P409, 5xx beide routes = $P5XX — $CO_STAND — exit $rc_co" >> "$UIT"
            echo "STATUS corrigeren: rapport in $UIT (exit $rc_co = uitkomst)"
          fi
          if [[ "$ONDERDEEL" == "query" ]]; then
            # Feiten eerst (Peter 17-09 punt 4 / blok D): Cowork laat zonder CC een db-lezen-rapport draaien — lees-only
            # querybibliotheek (app/lezen/queries, allowlist in nameting.sh), uitkomst als verkenning/lezen-<dd-mm>-<query>.txt.
            # Alleen de querynaam + --param/--administratie worden doorgegeven; `--sql` is hier bewust niet toegestaan (dat is
            # de replica-route via POST /lezen/sql of scripts/gcp/db_lezen.sh).
            [[ -n "$QUERY" ]] || { echo "::error::onderdeel=query vereist input 'query'"; exit 1; }
            if grep -qE -- '(^|[[:space:]])--(sql|als)([[:space:]]|$)' <<<"$QUERY"; then
              echo "::error::input 'query' mag geen --sql/--als dragen (vrije SQL loopt uitsluitend via de leesreplica-route)"; exit 1
            fi
            QNAAM="$(awk '{print $1}' <<<"$QUERY")"
            SLUG="$(tr -c 'a-z0-9\n' '-' <<<"$(tr '[:upper:]' '[:lower:]' <<<"$QNAAM")" | tr -s '-' | sed 's/-$//')"
            UIT="verkenning/lezen-$DATUM-$SLUG.txt"
            rc_q=0
            # shellcheck disable=SC2086 — de input is bewust woord-gesplitst (querynaam + parameters)
            scripts/gcp/nameting.sh db-lezen $QUERY > "$UIT" 2> nameting-query.stderr || rc_q=$?
            cat nameting-query.stderr >&2
            if grep -q "geen executie-naam gevonden\|PERMISSION_DENIED\|Reauthentication\|does not have permission" nameting-query.stderr; then
              echo "::error::db-lezen kon geen job-executie starten (auth/IAM) — zie stderr hierboven"
              exit 1
            fi
            [[ -s "$UIT" ]] || echo "(lege uitvoer — job-executie eindigde met code $rc_q)" >> "$UIT"
            echo "STATUS query ($QNAAM): rapport in $UIT (job-exit $rc_q = uitkomst)"
          fi
          # Oordeelregel voor het commitbericht: uit het rapport van het GEDRAAIDE onderdeel (werkloop-nazorg 14-09 — run
          # f4c702c droeg de replay-oordeelregel bij een reconciliatie-meting, misleidend): reconciliatie → het
          # reconciliatie-rapport van vandaag, anders het replay-rapport. Geen oordeelregel gevonden = "geen oordeelregel".
          if [[ "$ONDERDEEL" == "reconciliatie" ]]; then
            OORDEEL_BRON="verkenning/nameting-reconciliatie-$DATUM.txt"
          elif [[ "$ONDERDEEL" == "app-bundels" ]]; then
            OORDEEL_BRON="verkenning/nameting-app-bundels-$DATUM.txt"
          elif [[ "$ONDERDEEL" == "projecten-afgesloten" ]]; then
            OORDEEL_BRON="verkenning/nameting-projecten-afgesloten-$DATUM.txt"
          elif [[ "$ONDERDEEL" == "groep-saldi" ]]; then
            OORDEEL_BRON="verkenning/nameting-groep-saldi-$DATUM.txt"
          elif [[ "$ONDERDEEL" == "bua-kandidaten" ]]; then
            OORDEEL_BRON="verkenning/nameting-bua-kandidaten-$DATUM.txt"
          elif [[ "$ONDERDEEL" == "veldwerkers-dubbelen" ]]; then
            OORDEEL_BRON="verkenning/nameting-veldwerkers-dubbelen-$DATUM.txt"
          elif [[ "$ONDERDEEL" == "btw-niet-plichtig" ]]; then
            OORDEEL_BRON="verkenning/nameting-btw-niet-plichtig-$DATUM.txt"
          elif [[ "$ONDERDEEL" == "corrigeren" ]]; then
            OORDEEL_BRON="verkenning/nameting-corrigeren-$DATUM.txt"
          elif [[ "$ONDERDEEL" == "jobs-start" ]]; then
            OORDEEL_BRON="verkenning/nameting-jobs-start-$DATUM.txt"
          elif [[ "$ONDERDEEL" =~ ^(alles|a|b|c|d|e)$ ]]; then
            OORDEEL_BRON="verkenning/nameting-vgg-replay-$DATUM.txt"
          else
            # 22-09 (nameting jobs-start: de bot-commit a786e53 droeg "Oordeel: ROOD" uit het VGG-replay-rapport van die dag
            # terwijl het eigen rapport groen was — het onderdeel had geen eigen tak): élk ander onderdeel leest zijn EIGEN
            # rapport `nameting-<onderdeel>-<dd-mm>.txt`; bestaat dat niet (btw-default draagt een slug) → "geen oordeelregel",
            # nooit de replay-regel van een ander onderdeel.
            OORDEEL_BRON="verkenning/nameting-$ONDERDEEL-$DATUM.txt"
          fi
          OORDEEL=""
          if [[ -f "$OORDEEL_BRON" ]]; then
            OORDEEL="$(grep -m1 -o 'Oordeel: [^*]*' "$OORDEEL_BRON" | cut -c1-140 || true)"
          fi
          if [[ "$ONDERDEEL" == "query" ]]; then
            OORDEEL="db-lezen $(awk '{print $1}' <<<"$QUERY") — $(grep -m1 -oE '[0-9]+ rij\(en\)[^|]*' "$UIT" 2>/dev/null | cut -c1-100 || echo 'geen uitkomstregel')"
          fi
          [[ -n "$OORDEEL" ]] || OORDEEL="geen oordeelregel ($(ls verkenning/nameting-*-"$DATUM".txt 2>/dev/null | wc -l | tr -d ' ') rapport(en) van $DATUM)"
          echo "datum=$DATUM" >> "$GITHUB_OUTPUT"
          echo "oordeel=$OORDEEL" >> "$GITHUB_OUTPUT"

      - name: Uitkomsten committen als nameting-bot (alleen verkenning/nameting-*.txt en verkenning/lezen-*.txt)
        env:
          ONDERDEEL: ${{ inputs.onderdeel || 'alles' }}
          DATUM: ${{ steps.meting.outputs.datum }}
          OORDEEL: ${{ steps.meting.outputs.oordeel }}
        run: |
          set -euo pipefail
          git config user.name "nameting-bot"
          git config user.email "nameting@rlz-boekhouding.iam.gserviceaccount.com"
          # Alleen bestaande bestanden stagen (nullglob): een pathspec zonder treffer ("fatal: pathspec 'verkenning/lezen-*.txt'
          # did not match any files") maakte de bot-commit rood zodra er geen lezen-rapport lag (runs 35209089568 / 35227253545,
          # 17-09) — de meting zelf was klaar, het bestand kwam nooit op main.
          shopt -s nullglob
          UITKOMSTEN=(verkenning/nameting-*.txt verkenning/lezen-*.txt)
          shopt -u nullglob
          [[ -n "${UITKOMSTEN[*]:-}" ]] && git add -- "${UITKOMSTEN[@]}"
          if git diff --cached --quiet; then
            echo "geen wijzigingen in verkenning/nameting-*.txt of verkenning/lezen-*.txt — geen commit"
            exit 0
          fi
          git commit -m "nameting $DATUM $ONDERDEEL — $OORDEEL"
          # Peter kan intussen gepusht hebben: één keer rebasen en opnieuw proberen (alleen onze txt-bestanden raken).
          git push origin HEAD:main || { git pull --rebase origin main && git push origin HEAD:main; }
