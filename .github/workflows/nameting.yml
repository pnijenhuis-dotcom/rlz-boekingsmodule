            echo "STATUS extern-geboekt: rapport in $UIT (exit $rc_eg = uitkomst)"
          fi
          if [[ "$ONDERDEEL" == "activa-kaart" ]]; then
            # 24-09 (BUG activa-kaart BLOw 23-09; BESLISSINGEN "ACTIVA / MVA — FASE 1 GEBOUWD (Peter 21-09)" alinea "BUG 24-09"):
            # lees-only meetlat voor de kaart-fix — (1) request-log POST …/activa-voorstel/{regel}/aanmaken sinds de deploy
            # (200 = gepland/aangemaakt, 422 = "Kies een afschrijvingsrekening" (nooit meer gepland zonder), 5xx = rood);
            # (2) job-log rlz-reconciliatie laatste 2 dagen: regels soort=activum_aanmaken_mislukt(_mens) van de échte run;
            # (3) db-lezen activa-stand (rij `koppeling` per status) + reconciliatie-bevindingen (afwijking_soort
            # activum_aanmaken_mislukt_mens) voor BLOw en Pilates Bloom; (4) rlz-lezen FixedAssets BLOw (herstel-klikpunt:
            # 0 → 2 records mét InvoiceReference 23619/06052). Oordeel: POST 200/422/5xx + BLOw-register.
            UIT="verkenning/nameting-activa-kaart-$DATUM.txt"
            rc_ak=0
            SINDS_AK="2026-09-23T19:00:00Z"
            {
              echo "== request-log POST …/activa-voorstel/*/aanmaken sinds $SINDS_AK (deploy BUG-fix 24-09) =="
              gcloud logging read 'resource.type="cloud_run_revision" resource.labels.service_name="rlz-backend" httpRequest.requestMethod="POST" httpRequest.requestUrl:"/activa-voorstel/" timestamp>="'"$SINDS_AK"'"' \
                --project "$PROJECT_ID" --limit 500 --order asc \
                --format='value(timestamp,httpRequest.requestMethod,httpRequest.status,httpRequest.latency,httpRequest.requestUrl)' > nameting-ak-log.txt || rc_ak=$?
              cat nameting-ak-log.txt
              [[ -s nameting-ak-log.txt ]] || echo "(geen POST aanmaken/overslaan sinds de deploy — kaart ongebruikt)"
              echo
              echo "== job-log rlz-reconciliatie laatste 2 dagen: activum_aanmaken_mislukt(_mens) (échte runs) =="
              gcloud logging read 'resource.type="cloud_run_job" resource.labels.job_name="rlz-reconciliatie" timestamp>="'"$(date -u -d '2 days ago' +%Y-%m-%dT00:00:00Z)"'" textPayload:"activum_aanmaken_mislukt"' \
                --project "$PROJECT_ID" --limit 200 --order asc \
                --format='value(timestamp,labels."run.googleapis.com/execution_name",textPayload)' > nameting-ak-job.txt || rc_ak=$?
              cat nameting-ak-job.txt
              [[ -s nameting-ak-job.txt ]] || echo "(geen activum_aanmaken_mislukt-regels in de job-logs)"
              echo
              for ADM in "BLOw" "Pilates"; do
                echo "== db-lezen activa-stand --administratie $ADM (rij koppeling per status) =="
                scripts/gcp/nameting.sh db-lezen activa-stand --administratie "$ADM" 2> nameting-ak-db.stderr || { echo "(db-lezen exit $? — stderr:)"; cat nameting-ak-db.stderr; }
                echo
                echo "== db-lezen reconciliatie-bevindingen --administratie $ADM --param afwijking_soort=activum_aanmaken_mislukt_mens (laatste afgeronde run) =="
                scripts/gcp/nameting.sh db-lezen reconciliatie-bevindingen --administratie "$ADM" --param afwijking_soort=activum_aanmaken_mislukt_mens 2> nameting-ak-db2.stderr || { echo "(db-lezen exit $? — stderr:)"; cat nameting-ak-db2.stderr; }
                echo
              done
              echo "== rlz-lezen FixedAssets BLOw (herstel-klikpunt Peter: verwacht 2 records InvoiceReference 23619/06052) =="
              scripts/gcp/nameting.sh rlz-lezen --administratie "BLOw" --pad FixedAssets --expand DepreciationMethod --top 10 2> nameting-ak-rlz.stderr || { echo "(rlz-lezen exit $? — stderr:)"; cat nameting-ak-rlz.stderr; }
            } > "$UIT"
            AK_200="$(awk -F'\t' '$2=="POST" && $3=="200" && $5 ~ /\/aanmaken$/' nameting-ak-log.txt | wc -l | tr -d ' ')"
            AK_422="$(awk -F'\t' '$2=="POST" && $3=="422" && $5 ~ /\/aanmaken$/' nameting-ak-log.txt | wc -l | tr -d ' ')"
            AK_5XX="$(awk -F'\t' '$3 ~ /^5/' nameting-ak-log.txt | wc -l | tr -d ' ')"
            AK_MENS="$(grep -c 'soort=activum_aanmaken_mislukt_mens' nameting-ak-job.txt || true)"
            AK_FA="$(grep -c '"InvoiceReference"' "$UIT" || true)"
            if [[ "$AK_5XX" -ge 1 ]]; then AK_STAND="ROOD — 5xx op de kaart-route"; elif [[ "$AK_200" -ge 1 || "$AK_422" -ge 1 ]]; then AK_STAND="werkt in productie: ja (kaart gebruikt ná de fix, 0 × 5xx)"; else AK_STAND="niet gemeten (kaart ongebruikt sinds de deploy — herstel BLOw = klikpunt Peter)"; fi
            echo "Oordeel: POST aanmaken 200 = $AK_200, 422 = $AK_422, 5xx = $AK_5XX, mislukt_mens-regels job-log = $AK_MENS, FixedAssets-records BLOw = $AK_FA — $AK_STAND — exit $rc_ak" >> "$UIT"
            echo "STATUS activa-kaart: rapport in $UIT (exit $rc_ak = uitkomst)"
          fi
          if [[ "$ONDERDEEL" == "query" ]]; then
            # Feiten eerst (Peter 17-09 punt 4 / blok D): Cowork laat zonder CC een db-lezen-rapport draaien — lees-only
            # querybibliotheek (app/lezen/queries, allowlist in nameting.sh), uitkomst als verkenning/lezen-<dd-mm>-<query>.txt.
            # Alleen de querynaam + --param/--administratie worden doorgegeven; `--sql` is hier bewust niet toegestaan (dat is
            # de replica-route via POST /lezen/sql of scripts/gcp/db_lezen.sh).
            [[ -n "$QUERY" ]] || { echo "::error::onderdeel=query vereist input 'query'"; exit 1; }
            if grep -qE -- '(^|[[:space:]])--(sql|als)([[:space:]]|$)' <<<"$QUERY"; then
              echo "::error::input 'query' mag geen --sql/--als dragen (vrije SQL loopt uitsluitend via de leesreplica-route)"; exit 1
            fi
            QNAAM="$(awk '{print $1}' <<<"$QUERY")"
            SLUG="$(tr -c 'a-z0-9\n' '-' <<<"$(tr '[:upper:]' '[:lower:]' <<<"$QNAAM")" | tr -s '-' | sed 's/-$//')"
            UIT="verkenning/lezen-$DATUM-$SLUG.txt"
            rc_q=0
            # shellcheck disable=SC2086 — de input is bewust woord-gesplitst (querynaam + parameters)
            scripts/gcp/nameting.sh db-lezen $QUERY > "$UIT" 2> nameting-query.stderr || rc_q=$?
            cat nameting-query.stderr >&2
            if grep -q "geen executie-naam gevonden\|PERMISSION_DENIED\|Reauthentication\|does not have permission" nameting-query.stderr; then
              echo "::error::db-lezen kon geen job-executie starten (auth/IAM) — zie stderr hierboven"
              exit 1
            fi
            [[ -s "$UIT" ]] || echo "(lege uitvoer — job-executie eindigde met code $rc_q)" >> "$UIT"
            echo "STATUS query ($QNAAM): rapport in $UIT (job-exit $rc_q = uitkomst)"
          fi
          # Oordeelregel voor het commitbericht: uit het rapport van het GEDRAAIDE onderdeel (werkloop-nazorg 14-09 — run
          # f4c702c droeg de replay-oordeelregel bij een reconciliatie-meting, misleidend): reconciliatie → het
          # reconciliatie-rapport van vandaag, anders het replay-rapport. Geen oordeelregel gevonden = "geen oordeelregel".
          if [[ "$ONDERDEEL" == "reconciliatie" ]]; then
            OORDEEL_BRON="verkenning/nameting-reconciliatie-$DATUM.txt"
          elif [[ "$ONDERDEEL" == "app-bundels" ]]; then
            OORDEEL_BRON="verkenning/nameting-app-bundels-$DATUM.txt"
          elif [[ "$ONDERDEEL" == "projecten-afgesloten" ]]; then
            OORDEEL_BRON="verkenning/nameting-projecten-afgesloten-$DATUM.txt"
          elif [[ "$ONDERDEEL" == "groep-saldi" ]]; then
            OORDEEL_BRON="verkenning/nameting-groep-saldi-$DATUM.txt"
          elif [[ "$ONDERDEEL" == "bua-kandidaten" ]]; then
            OORDEEL_BRON="verkenning/nameting-bua-kandidaten-$DATUM.txt"
          elif [[ "$ONDERDEEL" == "veldwerkers-dubbelen" ]]; then
            OORDEEL_BRON="verkenning/nameting-veldwerkers-dubbelen-$DATUM.txt"
          elif [[ "$ONDERDEEL" == "btw-niet-plichtig" ]]; then
            OORDEEL_BRON="verkenning/nameting-btw-niet-plichtig-$DATUM.txt"
          elif [[ "$ONDERDEEL" == "intake-postvak-audit" ]]; then
            OORDEEL_BRON="verkenning/nameting-intake-postvak-audit-$DATUM.txt"
          elif [[ "$ONDERDEEL" == "corrigeren" ]]; then
            OORDEEL_BRON="verkenning/nameting-corrigeren-$DATUM.txt"
          elif [[ "$ONDERDEEL" == "checks-cache" ]]; then
            OORDEEL_BRON="verkenning/nameting-checks-cache-$DATUM.txt"
          elif [[ "$ONDERDEEL" == "extern-geboekt" ]]; then
            OORDEEL_BRON="verkenning/nameting-extern-geboekt-$DATUM.txt"
          elif [[ "$ONDERDEEL" == "jobs-start" ]]; then
            OORDEEL_BRON="verkenning/nameting-jobs-start-$DATUM.txt"
          elif [[ "$ONDERDEEL" == "activa-kaart" ]]; then
            OORDEEL_BRON="verkenning/nameting-activa-kaart-$DATUM.txt"
          elif [[ "$ONDERDEEL" == "ai-heraanbieden" ]]; then
            OORDEEL_BRON="verkenning/nameting-ai-heraanbieden-$DATUM.txt"
          elif [[ "$ONDERDEEL" =~ ^(alles|a|b|c|d|e)$ ]]; then
            OORDEEL_BRON="verkenning/nameting-vgg-replay-$DATUM.txt"
          else
            # 22-09 (nameting jobs-start: de bot-commit a786e53 droeg "Oordeel: ROOD" uit het VGG-replay-rapport van die dag
            # terwijl het eigen rapport groen was — het onderdeel had geen eigen tak): élk ander onderdeel leest zijn EIGEN
            # rapport `nameting-<onderdeel>-<dd-mm>.txt`; bestaat dat niet (btw-default draagt een slug) → "geen oordeelregel",
            # nooit de replay-regel van een ander onderdeel.
            OORDEEL_BRON="verkenning/nameting-$ONDERDEEL-$DATUM.txt"
          fi
          OORDEEL=""
          if [[ -f "$OORDEEL_BRON" ]]; then
            OORDEEL="$(grep -m1 -o 'Oordeel: [^*]*' "$OORDEEL_BRON" | cut -c1-140 || true)"
          fi
          if [[ "$ONDERDEEL" == "query" ]]; then
            OORDEEL="db-lezen $(awk '{print $1}' <<<"$QUERY") — $(grep -m1 -oE '[0-9]+ rij\(en\)[^|]*' "$UIT" 2>/dev/null | cut -c1-100 || echo 'geen uitkomstregel')"
          fi
          [[ -n "$OORDEEL" ]] || OORDEEL="geen oordeelregel ($(ls verkenning/nameting-*-"$DATUM".txt 2>/dev/null | wc -l | tr -d ' ') rapport(en) van $DATUM)"
          echo "datum=$DATUM" >> "$GITHUB_OUTPUT"
          echo "oordeel=$OORDEEL" >> "$GITHUB_OUTPUT"

      - name: Uitkomsten committen als nameting-bot (alleen verkenning/nameting-*.txt en verkenning/lezen-*.txt)
        env:
          ONDERDEEL: ${{ inputs.onderdeel || 'alles' }}
          DATUM: ${{ steps.meting.outputs.datum }}
          OORDEEL: ${{ steps.meting.outputs.oordeel }}
        run: |
          set -euo pipefail
          git config user.name "nameting-bot"
          git config user.email "nameting@rlz-boekhouding.iam.gserviceaccount.com"
          # Alleen bestaande bestanden stagen (nullglob): een pathspec zonder treffer ("fatal: pathspec 'verkenning/lezen-*.txt'
          # did not match any files") maakte de bot-commit rood zodra er geen lezen-rapport lag (runs 35209089568 / 35227253545,
          # 17-09) — de meting zelf was klaar, het bestand kwam nooit op main.
          shopt -s nullglob
          UITKOMSTEN=(verkenning/nameting-*.txt verkenning/lezen-*.txt)
          shopt -u nullglob
          [[ -n "${UITKOMSTEN[*]:-}" ]] && git add -- "${UITKOMSTEN[@]}"
          if git diff --cached --quiet; then
            echo "geen wijzigingen in verkenning/nameting-*.txt of verkenning/lezen-*.txt — geen commit"
            exit 0
          fi
          git commit -m "nameting $DATUM $ONDERDEEL — $OORDEEL"
          # Peter kan intussen gepusht hebben: één keer rebasen en opnieuw proberen (alleen onze txt-bestanden raken).
          git push origin HEAD:main || { git pull --rebase origin main && git push origin HEAD:main; }
